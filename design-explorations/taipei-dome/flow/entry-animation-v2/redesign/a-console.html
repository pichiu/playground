<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演練指揮台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0d1315;--map:#0f171a;--ink:#e9efe9;--dim:#8fa29f;--faint:#3a4a4b;--line:#22302f;--floor:#152124;--white:#f5efe3;--blue:#4f93e6;--amber:#f2a73b;--teal:#57c3a6;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
::selection{background:var(--amber);color:#111}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.stage{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto}
.maps{position:relative;min-height:0;display:grid;grid-template-columns:1fr;grid-row:1;grid-column:1}
.hud{grid-row:1;grid-column:1;position:relative;pointer-events:none;min-height:0}.hud>*{pointer-events:auto}
.pane{position:relative;min-width:0;min-height:0}
canvas{display:block;width:100%;height:100%}
.title{position:absolute;left:28px;top:22px;z-index:2}
.title a{color:var(--dim);text-decoration:none;font-size:12px}
.title a:hover{color:var(--ink)}
.title h1{margin:6px 0 0;font-size:26px;font-weight:900;letter-spacing:.04em}
.title p{margin:2px 0 10px;color:var(--dim);font-size:13px}
.clock{position:absolute;right:28px;top:18px;text-align:right;z-index:2}
.clock b{display:block;font-size:64px;line-height:1;font-weight:700;letter-spacing:-.02em}
.clock span{color:var(--dim);font-size:13px}
.phase{color:var(--amber)!important;font-weight:700}
/* 流量柱：一根柱子講完「人在哪」；對照時兩根上下並列 */
.flows{position:absolute;left:28px;bottom:24px;width:220px;display:grid;gap:16px;z-index:2}
.flow small{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
.flow-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-bottom:10px}
.flow-bar i{display:block;height:100%}
.flow dl{margin:0;display:grid;grid-template-columns:12px 1fr auto;gap:4px 9px;align-items:center;font-size:13px}
.flow dt{width:10px;height:10px;border-radius:50%}
.flow dd{margin:0}.flow dd.n{font-weight:700;text-align:right;min-width:48px}
.flow dd.l{color:var(--dim)}
.flow dd.d{grid-column:2/-1;color:var(--amber);font-size:12px;margin-top:-2px}
.focus{position:absolute;right:28px;bottom:24px;width:250px;font-size:13px;color:var(--dim);z-index:2}
.focus strong{color:var(--ink);font-size:15px;display:block;margin-bottom:6px}
.focus ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.focus li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.focus li.now{color:var(--ink)}.focus li.now span:first-child{color:var(--amber)}
.legend{position:absolute;left:28px;top:150px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim);z-index:2}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%}
.legend i.ln{width:22px;height:3px;border-radius:2px}.legend i.ln.dim{opacity:.55}
.legend .num{color:var(--amber);font-size:12px;min-width:22px}
/* 底部時間軸 */
.deck{grid-row:2;border-top:1px solid var(--line);padding:14px 28px 18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--bg)}
.ctl{display:flex;gap:6px;align-items:center}
.play{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.play:hover{background:#fff}
.speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:8px}
.speed button{padding:6px 10px;color:var(--dim);font-size:13px}
.speed button[aria-pressed=true]{background:var(--line);color:var(--ink)}
.track{position:relative;cursor:pointer;touch-action:none;display:grid;gap:6px;padding:4px 0}
.lane{position:relative;height:16px;font-size:11px;color:var(--dim)}
.lane>b{position:absolute;right:100%;margin-right:8px;font-weight:500;white-space:nowrap;line-height:16px}
.lane i{position:absolute;top:0;height:100%;border-radius:3px;font-style:normal}
.lane.w i{background:var(--teal);box-shadow:0 0 0 1px var(--bg)}
.lane i span{position:absolute;left:5px;top:0;line-height:16px;font-weight:700;white-space:nowrap}
.lane.w i span{color:var(--bg)}
.lane.d i{background:var(--faint)}
.lane.d.v2 i{background:#2c4a63}
.head{position:absolute;top:-6px;bottom:-4px;width:2px;background:var(--amber);pointer-events:none}
.head::after{content:'';position:absolute;top:-4px;left:-5px;border:6px solid transparent;border-top-color:var(--amber)}
.track.has-labels{margin-left:44px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
@media(max-width:860px){.focus,.legend{display:none}.title p{display:none}.clock{top:auto;bottom:24px;right:16px;max-width:150px}.clock b{font-size:34px}.clock span{display:block}.title h1{font-size:20px}.flows{width:180px;left:16px}.deck{padding:10px 16px;grid-template-columns:1fr}.title{left:16px}</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="maps" id="maps"><div class="loading" id="loading">讀取動線資料…</div></div>
 <div class="hud">
 <div class="title"><a href="index.html">‹ 2c 六種看法</a><h1>入經藏 · 西一＋桃竹 進場</h1><p>1,609 人 · 9 大隊 · 休息區 → 集結 → 西一入口 → 身分證位置</p></div>
 <div class="clock"><b id="clock">00:00</b><span class="phase" id="phase"></span> <span>／ 全長 <span id="end"></span></span></div>
 <div class="legend"><span><i class="ln" style="background:var(--white)"></i>白衣隊伍</span><span><i class="ln" style="background:var(--blue)"></i>藍衣隊伍</span><span><i class="ln dim" style="background:var(--blue)"></i>集結區排隊中</span><span><b class="num">196</b>集結區旁數字＝在那裡等的人數</span></div>
 <div class="flows" id="flows"></div>
 <div class="focus" id="focus"><strong>口令表</strong><ol id="cues"></ol></div>
 </div>
 <div class="deck">
  <div class="ctl">
   <button class="play" id="play" aria-label="播放"><svg width="18" height="20" viewBox="0 0 18 20" id="ico"><path d="M2 1.5v17L17 10z" fill="currentColor"/></svg></button>
   <div class="speed" id="speed" role="group" aria-label="播放速度"></div>
  </div>
  <div class="track" id="track" role="slider" aria-label="時間軸" tabindex="0"><div id="lanes" style="display:grid;gap:6px"></div><div class="head" id="head"></div></div>
 </div>
</div>
<script src="core.js"></script>
<script>
'use strict';
const {pos,state,counts,fmt,View}=Dome,$=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const C={};for(const n of ['map','floor','line','faint','dim','ink','white','blue','amber','teal','bg'])C[n]=css(n);
const STATES=[['seated','休息區',C.faint],['walk','走廊／樓梯',C.teal],['wait','集結等待',C.amber],['enter','進場中',C.blue],['done','已到位',C.white]];
const frameFor=v=>v.w<760?[-19,-11.6,4,11.6]:[-15.5,-11.6,4,11.6];
let ds=null,view=null,t=0,playing=false,speed=6,last=0,dirty=true,T=1,cues=[];
const pct=x=>x/T*100+'%';
function stats(ds){const P=ds.P,waves=[1,2,3].map(w=>{const ts=P.filter(p=>p.exitWave===w).map(p=>p.t.leave);return {w,a:Math.min(...ts),b:Math.max(...ts)};});
 const dad=Array.from({length:9},(_,i)=>{const ps=P.filter(p=>p.dadui===i+1);return {k:i+1,a:Math.min(...ps.map(p=>p.t.enter)),b:Math.max(...ps.map(p=>p.t.arrive))};});return {waves,dad};}
async function init(){ds=await Dome.fetchData();if(!ds)return;
 ds.s=stats(ds);T=ds.T_END;t=Math.min(t,T);
 $('maps').innerHTML=`<div class="pane"><canvas id="cv0" aria-label="動線地圖"></canvas></div>`;
 if(view)view.destroy();view=new View($('cv0'),{pad:40});view.fit(frameFor(view),true);view.onresize=()=>{view.fit(frameFor(view),true);dirty=true;};
 $('end').textContent=fmt(T);
 // 時間軸：三出 + 九大隊
 const wavesHtml=d=>d.s.waves.map(o=>`<i style="left:${pct(o.a)};width:calc(${pct(o.b-o.a)} - 2px);opacity:${.45+o.w*.13}"><span>第${'一二三'[o.w-1]}出</span></i>`).join('');
 const dadHtml=d=>d.s.dad.map(o=>`<i style="left:${pct(o.a)};width:calc(${pct(o.b-o.a)} - 2px)"><span>${o.k}</span></i>`).join('');
 $('lanes').innerHTML=`<div class="lane w">${wavesHtml(ds)}</div><div class="lane d">${dadHtml(ds)}</div>`;
 cues=[{t:0,s:'全員休息區就座'},...ds.s.waves.map(o=>({t:o.a,s:`第${'一二三'[o.w-1]}出 離座`})),...ds.s.dad.map(o=>({t:o.a,s:`大隊 ${o.k} 由西一入口進場`})),{t:ds.T_END,s:'全員到位'}].sort((a,b)=>a.t-b.t);
 $('flows').innerHTML=`<div class="flow"><div class="flow-bar" id="bar0">${STATES.map(([k,,c])=>`<i data-k="${k}" style="background:${c}"></i>`).join('')}</div><dl id="dl"></dl></div>`;
 $('dl').innerHTML=STATES.map(([k,l,c])=>`<dt style="background:${c}"></dt><dd class="l">${l}</dd><dd class="n" data-n="0-${k}"></dd>`).join('');
 $('loading')&&$('loading').remove();dirty=true;}
function phaseName(ds){const c=counts(t,ds.P),{waves,dad}=ds.s;if(c.done===ds.P.length)return '全員到位';if(t<waves[0].a)return '休息區就座';if(t<dad[0].a)return '離座 · 往集結';return `大隊 ${dad.filter(o=>t>=o.a).pop().k} 進場中`;}
function drawPane(v,ds){const c=v.begin(C.map),D=ds.D,P=ds.P,r=Math.max(1.1,.042*v.s);
 v.base(D.map,{floor:C.floor,fieldLine:C.line,stage:C.line,wall:C.faint,band:C.dim,bandA:.07,lane:C.teal,laneA:.06,stand:C.faint,gate:C.amber});
 for(const s of D.map.stands)v.text(s.sec,...s.labelXY,{color:C.dim,size:10,dx:6});
 c.globalAlpha=.35;for(const p of P)if(state(p,t)!=='done')v.dot(p.field.X,p.field.Y,Math.max(.6,.03*v.s),null,C.faint,.6);c.globalAlpha=1;
 // 集結區：名稱旁直接寫此刻等待人數，不畫圈，免得蓋住排隊的人
 const wait={};for(const p of P)if(state(p,t)==='wait'){let z=p.assembly;for(const a of p.adv||[])if(t>=a[0])z=a[2];wait[z]=(wait[z]||0)+1;}   // 遞補往前：以此刻站的區計
 for(const [k,n] of Object.entries(D.nodes)){if(!/^P\d$/.test(k))continue;const w=wait[k]||0;v.text(w?`${n.label}　${w}`:n.label,n.X,n.Y,{color:w?C.amber:C.dim,size:12,weight:700,halo:C.map,align:'right',dx:n.floor==='B1'?-14:-12,dy:n.floor==='B1'?0:10});}
 {const a=D.nodes.STAIR_TOP,b=D.nodes.STAIR_BOT,w=wait.STAIR||0;v.text(w?`樓梯　${w}`:'樓梯',(a.X+b.X)/2,(a.Y+b.Y)/2,{color:w?C.amber:C.dim,size:12,weight:700,halo:C.map,align:'right',dx:-30,dy:8});}
 v.text(D.nodes.GATE6.label,D.nodes.GATE6.X,D.nodes.GATE6.Y,{color:C.amber,size:13,weight:900,halo:C.map,align:'right',dx:-14});
 // 休息區淡點、到位實點
 for(const p of P){const st=state(p,t);if(st!=='seated'&&st!=='done')continue;const q=pos(p,t);c.globalAlpha=st==='seated'?.3:1;v.dot(q[0],q[1],st==='seated'?r*.7:r,p.costume==='白'?C.white:C.blue);}c.globalAlpha=1;
 // 隊伍線：同一列、同一階段（走／等／進場）的人依前後順序連成一條；彼此距離拉開就斷開。排隊中畫淡，行進中在線頭加點標出前方
 const rows=new Map();for(const p of P){const st=state(p,t);if(st==='seated'||st==='done')continue;const key=p.lie+'|'+st;(rows.get(key)||rows.set(key,[]).get(key)).push(p);}
 c.lineCap='round';c.lineJoin='round';
 for(const [key,ps] of rows){const st=key.split('|')[1],col=ps[0].costume==='白'?C.white:C.blue;
  ps.sort((a,b)=>st==='enter'?a.t.gate-b.t.gate:st==='wait'?a.t.assembly-b.t.assembly:a.t.leave-b.t.leave);
  const pts=ps.map(p=>pos(p,t));let seg=[pts[0]];
  const flush=()=>{c.globalAlpha=st==='wait'?.55:.95;if(seg.length>1)v.stroke(seg.flat(),col,r*1.7);else v.dot(seg[0][0],seg[0][1],r,col);c.globalAlpha=1;};
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(Math.hypot(a[0]-b[0],a[1]-b[1])>.45){flush();seg=[b];}else seg.push(b);}flush();
  if(st!=='wait')v.dot(pts[0][0],pts[0][1],r*1.5,col,C.map,1);}}
function ui(){const d=ds,cs=counts(t,d.P);
 for(const [k] of STATES){$('bar0').querySelector(`[data-k=${k}]`).style.width=cs[k]/d.P.length*100+'%';const n=document.querySelector(`[data-n="0-${k}"]`);if(n)n.textContent=cs[k].toLocaleString('zh-TW');}
 $('clock').textContent=fmt(t);$('phase').textContent=phaseName(d);$('head').style.left=pct(t);
 let i=cues.findIndex(c=>c.t>t);if(i<0)i=cues.length;const from=Math.max(0,i-2);$('cues').innerHTML=cues.slice(from,from+5).map((c,j)=>`<li class="${from+j===i-1?'now':''}"><span>${fmt(c.t)}</span><span>${c.s}</span></li>`).join('');}
function setPlaying(on){playing=on;if(on&&t>=T)t=0;$('play').setAttribute('aria-label',on?'暫停':'播放');$('ico').innerHTML=on?'<rect x="2" y="1.5" width="5" height="17" fill="currentColor"/><rect x="11" y="1.5" width="5" height="17" fill="currentColor"/>':'<path d="M2 1.5v17L17 10z" fill="currentColor"/>';last=0;}
$('play').onclick=()=>setPlaying(!playing);
$('speed').innerHTML=[3,6,12,30].map(s=>`<button data-s="${s}" aria-pressed="${s===speed}">×${s}</button>`).join('');
$('speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;$('speed').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};
const track=$('track');function scrub(e){const r=$('lanes').getBoundingClientRect();t=Math.max(0,Math.min(T,(e.clientX-r.left)/r.width*T));dirty=true;}
let drag=false;track.onpointerdown=e=>{drag=true;track.setPointerCapture(e.pointerId);scrub(e);};track.onpointermove=e=>drag&&scrub(e);track.onpointerup=track.onpointercancel=()=>drag=false;
document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){t=Math.max(0,Math.min(T,t+(e.key==='ArrowLeft'?-10:10)));dirty=true;}};
function frame(now){if(ds&&view){if(playing){if(last)t=Math.min(T,t+(now-last)/1000*speed);last=now;dirty=true;if(t>=T)setPlaying(false);}if(view.step(now))dirty=true;if(dirty){drawPane(view,ds);ui();dirty=false;}}requestAnimationFrame(frame);}
window.__seek=x=>{t=x;dirty=true;};
init().then(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
