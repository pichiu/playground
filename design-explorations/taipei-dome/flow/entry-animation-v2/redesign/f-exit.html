<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2c · F 出口帶隊卡</title>
<link rel="icon" href="data:,">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<style>
:root{--bg:#f7f6f2;--ink:#1b2629;--dim:#58666a;--rule:#e1e0d8;--card:#fff;--accent:#176c61;--on-accent:#fff;--grid:#e6e5de;--dead:#9a9f9c;--keep:#e9a198;--laneA:#e0a73a;--laneB:#7fa5c7;--laneC:#9b8ad1;--tick:rgba(255,255,255,.5);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121819;--ink:#e6ebe8;--dim:#9fb0ad;--rule:#29353a;--card:#182225;--accent:#7fd0b4;--on-accent:#0e1a16;--grid:#2a373b;--dead:#55626a;--keep:#7a3f38;--tick:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme=dark]{--bg:#121819;--ink:#e6ebe8;--dim:#9fb0ad;--rule:#29353a;--card:#182225;--accent:#7fd0b4;--on-accent:#0e1a16;--grid:#2a373b;--dead:#55626a;--keep:#7a3f38;--tick:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dome-nav.bar{--line:var(--rule)}
.wrap{max-width:1120px;margin:auto;padding:14px max(16px,env(safe-area-inset-left)) 56px;overflow-x:hidden}
.back{color:var(--dim);text-decoration:none;font-size:14px}
.eyebrow{margin:12px 0 0;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.lede{margin:2px 0 0;color:var(--dim);font-size:15px;max-width:64ch}
.layout{display:grid;gap:14px;margin-top:14px;min-width:0}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 18px}
/* 左欄：選出口 */
.pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pick button{border:1.5px solid var(--rule);background:var(--card);border-radius:12px;padding:7px 3px 6px;display:grid;gap:1px;justify-items:center;min-width:0;overflow:hidden;line-height:1.15}
.pick button b{font-size:19px;font-weight:900}
.pick button small{font-size:clamp(9px,2.7vw,11px);color:var(--dim);white-space:nowrap;letter-spacing:-.01em}
.pick button .ln{display:none}
.pick button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick button[aria-pressed=true] small{color:inherit;opacity:.85}
.hint{margin:8px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
.lnchip{display:inline-block;min-width:1.5em;text-align:center;border-radius:4px;font-size:10px;font-weight:900;padding:0 3px;background:var(--lane);color:#1b2629}
@media(min-width:900px){
 .layout{grid-template-columns:184px minmax(0,1fr);gap:24px;align-items:start}
 .side{position:sticky;top:12px}
 .pick{grid-template-columns:1fr;gap:6px}
 .pick button{grid-template-columns:auto 1fr;grid-template-rows:auto auto;justify-items:start;align-items:center;text-align:left;padding:8px 12px;column-gap:10px}
 .pick button b{grid-row:1/3;font-size:22px}
 .pick button small{font-size:12px}
 .pick button .ln{display:flex;gap:3px}
}
/* 主區抬頭 */
h1{margin:0;font-size:clamp(26px,5vw,36px);line-height:1.2;font-weight:900;letter-spacing:.01em}
h1 span{font-size:.5em;font-weight:500;color:var(--dim);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:14px 0 0}
.facts dt{font-size:12px;color:var(--dim)}
.facts dd{margin:0;font-size:14px;line-height:1.45}
.facts dd b{display:block;font-size:22px;font-weight:900;line-height:1.15}
.segs{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.segs li{border-left:4px solid var(--lane);padding:6px 12px;background:var(--lane-bg);border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.segs li b.l{font-size:15px}
.segs li .tm{font-weight:700}
.segs li .nx{color:var(--dim);font-size:13px}
/* 每排色帶 */
.rows{margin-top:14px;padding-top:12px}
.rows h2{margin:0;font-size:17px;font-weight:900}
.how{margin:2px 0 10px;font-size:13px;color:var(--dim);line-height:1.5}
.dir{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:0 0 2px 74px;font-weight:700}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:3px 10px;padding:9px 0;border-top:1px solid var(--rule);align-items:center}
.row .rl b{display:block;font-size:15px;line-height:1.2}
.row .rl small{color:var(--dim);font-size:12px;line-height:1.3;display:block}
.band{display:flex;gap:1px;height:32px;min-width:0}
.pc{position:relative;flex:1 1 0;min-width:2px;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:3px solid var(--lane,transparent);font-size:12px;font-weight:700;letter-spacing:-.01em;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--n) - 1px),var(--tick) calc(100%/var(--n) - 1px),var(--tick) calc(100%/var(--n)))}
.pc .lb{white-space:nowrap;display:inline-block;padding:0 3px}
.pc.tight .lb{visibility:hidden}
.pc.empty{background:var(--grid);color:var(--dim);border-bottom-color:transparent;background-image:none}
.cap{grid-column:2;margin:0;font-size:12.5px;color:var(--dim);line-height:1.6}
.cap small{font-size:11.5px}
.cap .sep{opacity:.5;margin:0 2px}
.cap .emp{font-weight:700}
.lt{display:inline-block;font-weight:700;padding:0 6px;border-radius:5px;background:var(--lane-bg);color:var(--ink);font-style:normal;margin-right:3px}
.lane-A{--lane:var(--laneA);--lane-bg:rgba(224,167,58,.22)}.lane-B{--lane:var(--laneB);--lane-bg:rgba(127,165,199,.24)}.lane-C{--lane:var(--laneC);--lane-bg:rgba(155,138,209,.24)}
.hand{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--rule);align-items:start}
.hand .t{font-weight:900;font-size:15px;line-height:1.3;color:var(--ink)}
.hand .t small{display:block;font-weight:500;font-size:11px;color:var(--dim)}
.hand p{margin:0;font-size:14px;line-height:1.5;padding:4px 10px;border-left:4px solid var(--lane);background:var(--lane-bg);border-radius:0 8px 8px 0}
.hand.switch p{border-left-style:double;border-left-width:6px}
.unused{margin:6px 0 0;padding-top:8px;border-top:1px solid var(--rule);font-size:13px;color:var(--dim)}
/* 座位圖 */
.map{margin-top:18px}
.map h2{margin:0 0 4px;font-size:17px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.map h2 small{font-weight:500;font-size:12px;color:var(--dim)}
.map .tools{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.map .tools button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:3px 10px;font-size:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
canvas#seatmap{display:block;cursor:pointer}
#seat-tip{margin:10px 0 0;font-size:14px;min-height:1.6em;line-height:1.5}
#seat-tip b{font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.legend i.cur{border:2px solid var(--accent);background:none}
.err{color:var(--dim)}
@media(max-width:480px){.card{padding:14px 14px;border-radius:14px}.row{grid-template-columns:56px minmax(0,1fr);gap:3px 8px}.hand{grid-template-columns:56px minmax(0,1fr);gap:8px}.dir{padding-left:64px}}
@media print{
 @page{margin:12mm}
 *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 body{background:#fff;color:#000}
 .dome-nav,.side,.back,.map .tools,#seat-tip a{display:none!important}
 .wrap{max-width:none;padding:0}
 .layout{display:block}
 .card{border-color:#bbb;break-inside:avoid-page;page-break-inside:auto}
 .row,.hand,.segs li{break-inside:avoid}
 .scroll{overflow:visible}
 canvas#seatmap{width:100%!important;height:auto!important}
 .map{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">‹ 2c 六種看法</a>
<p class="eyebrow">F · 出口帶隊卡</p>
<p class="lede">休息區出口幹部用。選出口：由上排往下的帶隊順序、每排誰坐哪、每段走哪一路、什麼時候換口接尾。先走的坐上面，每排由出口側往中央。</p>
<div class="layout">
 <aside class="side" aria-label="選出口">
  <div class="pick" id="pick" role="group" aria-label="七個出口（用量／可用席）"></div>
  <p class="hint">數字為 用量／可用席。<span class="lnchip lane-A" style="background:var(--laneA)">A</span> 靠看台 <span class="lnchip" style="background:var(--laneB)">B</span> 中間 <span class="lnchip" style="background:var(--laneC)">C</span> 外側。</p>
 </aside>
 <main id="main">
  <section class="card" id="head"><p class="err">讀取動線資料…</p></section>
  <section class="card rows" id="rows"></section>
 </main>
</div>
<section class="card map" id="map">
 <h2><span>休息區座位圖 <small>七區並排 · 左 139 → 右 145 · 上排在上 · 顏色＝大隊，灰＝空席，玫瑰紅＝保留不坐，深灰＝不可用／工作席</small></span><span class="tools"><button type="button" id="zoom" aria-pressed="false">放大</button></span></h2>
 <div class="scroll" id="mapscroll"><canvas id="seatmap" role="img" aria-label="休息區七區座位圖，每席一格，顏色為大隊"></canvas></div>
 <p id="seat-tip" aria-live="polite">點一下座位：顯示位置編碼、大隊、走哪一路。</p>
 <div class="legend" id="legend"></div>
</section>
</div>
<script src="core.js"></script>
<script>
'use strict';
const {fmt}=Dome,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 大隊色：藍衣藍色系、白衣淡暖色，大隊 1→9 由淺到深；色帶上一律寫「{區塊}×{人數}」，顏色只是輔助。
const BLUE=['#d3e3f8','#b2cdf1','#8fb4e9','#6c9ae0','#3a6bbd','#2c5aa8','#244b92','#1d3d7a','#162f62'];
const WARM=['#fbf4e3','#f4e8c6','#ecd9a7','#e2c98a','#d6b86f','#c7a65a','#b59348','#86672a','#6d5320'];
const colorOf=p=>(p.costume==='藍'?BLUE:WARM)[p.dadui-1];
const inkOf=p=>(p.costume==='藍'?p.dadui>=5:p.dadui>=8)?'#ffffff':'#1b2629';   // 深色底才用白字，對比皆 ≥ 4.5:1
const SIDE={N:'往北側',S:'往南側'};
const PAI_MAX=14;
let ds=null,cur=null,SEC={},SECS=[],TH={min:0,max:1},sel=null,zoom=false,cells=[],cellMap=new Map(),rt=0;

// ---------- 索引：每區的座位、theta 範圍、可用席、出口在哪一端 ----------
function buildIdx(){const R=ds.D.restSeats;TH={min:Infinity,max:-Infinity};
 for(const s of R){const S=SEC[s.sec]||(SEC[s.sec]={sec:s.sec,seats:[],thMin:Infinity,thMax:-Infinity,usable:new Map()});S.seats.push(s);
  if(s.theta<S.thMin)S.thMin=s.theta;if(s.theta>S.thMax)S.thMax=s.theta;if(s.theta<TH.min)TH.min=s.theta;if(s.theta>TH.max)TH.max=s.theta;
  const ok=(s.kind==='normal'||s.kind==='blue')&&!s.reserved;   // 保留席由 build.py 寫進 restSeats[].reserved（plan.seat_reserved）
  if(ok){if(!S.usable.has(s.pai))S.usable.set(s.pai,[]);S.usable.get(s.pai).push(s.no);}}
 SECS=Object.keys(SEC).sort();
 for(const e of ds.exits){const S=SEC[e.sec];if(!S)continue;const f=ds.byId.get(e.order[0]).rest,st=S.seats.find(s=>s.pai===f.pai&&s.no===f.no);S.exitRight=st?st.theta>(S.thMin+S.thMax)/2:false;}}

// ---------- 左欄 ----------
function picker(){$('pick').innerHTML=ds.exits.map(e=>`<button type="button" data-exit="${e.key}" aria-pressed="false" title="${esc(ds.exitName(e.key))}"><b>${e.key}</b><small>${e.used}/${e.capacity}</small><span class="ln" aria-label="供應的路">${e.segments.map(s=>`<i class="lnchip" style="background:var(--lane${s.lane})">${s.lane}</i>`).join('')}</span></button>`).join('');
 $('pick').onclick=ev=>{const b=ev.target.closest('[data-exit]');if(b)choose(b.dataset.exit);};}

function choose(key,push=true){if(!ds.exitsByKey[key])key=ds.exits[0].key;render(key);if(push)history.replaceState(null,'',`?e=${key}`);drawMap(true);fitLabels();}

// ---------- 主區 ----------
function seatRange(nos){return nos.length?(nos.length===1?`${nos[0]} 號`:`${nos[0]}–${nos[nos.length-1]} 號`):'';}
function render(key){cur=key;const e=ds.exitsByKey[key],S=SEC[e.sec],byId=ds.byId;
 $('pick').querySelectorAll('[data-exit]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.exit===key)));
 const first=byId.get(e.order[0]),last=byId.get(e.order[e.order.length-1]);
 const empties=e.capacity-e.used;
 // 每段：接在誰後面、之後換誰
 const segs=e.segments.map((s,i)=>{const L=s.lane,ls=ds.lanes[L].segments,j=ls.findIndex(x=>x.exit===key),prev=ls[j-1],nx=ls[j+1];
  const nxSeg=nx?ds.exitsByKey[nx.exit].segments.find(x=>x.lane===L):null;
  return {s,i,L,prev,nx,nxSeg,blocks:s.label};});
 $('head').innerHTML=`<h1>${e.key} 出口 <span>（${esc(e.stairLabel)}）</span></h1>
 <dl class="facts">
  <div><dt>離座方向</dt><dd><b>${SIDE[e.side]||e.side}</b>上 ${esc(e.stairLabel)}</dd></div>
  <div><dt>本出口第一位離座</dt><dd><b>${fmt(first.t.leave)}</b>${first.id} · 第 ${first.rest.pai} 排 ${first.rest.no} 號</dd></div>
  <div><dt>最後一位離座</dt><dd><b>${fmt(last.t.leave)}</b>${last.id} · 第 ${last.rest.pai} 排 ${last.rest.no} 號</dd></div>
  <div><dt>用量</dt><dd><b>${e.used} <small style="font-size:14px;font-weight:500">/ ${e.capacity} 席</small></b>${e.rows.length} 排${empties?` · 空 ${empties} 席`:' · 坐滿'}</dd></div>
 </dl>
 <ol class="segs" aria-label="本出口供應的路與時間">${segs.map(({s,L,prev,nx,nxSeg,blocks})=>`<li class="lane-${L}"><b class="l">${esc(ds.laneName(L))}</b> ${blocks} · ${s.n} 人 · 第 ${s.fromRow} → ${s.toRow} 排<br><span class="tm">第一位 ${fmt(s.tFirstLeave)} 離座 … 最後一位 ${fmt(s.tLastLeave)}</span><br><span class="nx">${prev?`接在 ${prev.exit} 出口的 ${prev.toLabel} 之後`:`${L} 路由本出口開頭`}${nx?` → ${s.toLabel} 走完換 ${nx.exit} 出口（${nx.fromLabel} 起${nxSeg?'，'+fmt(nxSeg.tFirstLeave)+' 第一位離座':''}）`:` → ${s.toLabel} 走完 ${L} 路結束`}</span></li>`).join('')}</ol>`;
 // 段落交界：掛在該段最後一位所在那一排之後
 const hand=new Map(),push=(pai,h)=>{if(!hand.has(pai))hand.set(pai,[]);hand.get(pai).push(h);};
 for(const {s,i,L,nx,nxSeg} of segs){const lp=byId.get(s.lastId),where=`${s.lastId}，第 ${lp.rest.pai} 排 ${lp.rest.no} 號，${fmt(s.tLastLeave)} 離座`;
  push(s.toRow,`<div class="hand lane-${L}" data-handover="${esc(s.toBlock)}"><div class="t">${fmt(s.tLastLeave)}<small>換口</small></div><p><b>${s.toLabel} 最後一位</b>（${where}）→ ${nx?`<b>換 ${nx.exit} 出口接 ${L} 路</b>（${nx.fromLabel} 起${nxSeg?'，'+fmt(nxSeg.tFirstLeave)+' 第一位離座':''}）`:`<b>${L} 路到此結束</b>（全路 ${ds.lanes[L].total} 人走完）`}</p></div>`);
  const n2=e.segments[i+1];
  if(n2){const fp=byId.get(n2.firstId);push(s.toRow,`<div class="hand switch lane-${n2.lane}" data-handover="${esc(s.toBlock)}→${n2.lane}"><div class="t">${fmt(n2.tFirstLeave)}<small>本出口改路</small></div><p><b>${s.toLabel} 最後一位</b> → <b>本出口改供 ${n2.lane} 路</b>（${n2.fromLabel} 起，${n2.firstId} 第 ${fp.rest.pai} 排 ${fp.rest.no} 號，${fmt(n2.tFirstLeave)} 第一位離座；中間空 ${fmt(n2.tFirstLeave-s.tLastLeave)}）</p></div>`);}}
 // 每排
 const tot=r=>(S.usable.get(r.pai)||r.seats).length,maxTot=Math.max(...e.rows.map(tot));
 const rowsHtml=e.rows.map(r=>{const pieces=[];
  r.ids.forEach((id,i)=>{const p=byId.get(id),k=p.costume+p.dadui,lp=pieces[pieces.length-1];
   if(lp&&lp.k===k&&lp.lane===p.lane){lp.n++;lp.nos.push(r.seats[i]);}else pieces.push({k,lane:p.lane,n:1,nos:[r.seats[i]],p});});
  const used=new Set(r.seats),desc=r.seats.length>1&&r.seats[0]>r.seats[1];
  const empt=(S.usable.get(r.pai)||[]).filter(no=>!used.has(no)).sort((a,b)=>desc?b-a:a-b);
  const band=pieces.map(pc=>`<div class="pc lane-${pc.lane}" style="flex-grow:${pc.n};--n:${pc.n};background-color:${colorOf(pc.p)};color:${inkOf(pc.p)}" title="${pc.k}×${pc.n}，${seatRange(pc.nos)}，走 ${pc.lane} 路"><span class="lb">${pc.k}×${pc.n}</span></div>`).join('')
   +(empt.length?`<div class="pc empty" style="flex-grow:${empt.length};--n:${empt.length}" title="空 ${empt.length}，${seatRange(empt)}"><span class="lb">空 ${empt.length}</span></div>`:'');
  const cap=[];let lastLane=null;
  for(const pc of pieces){if(pc.lane!==lastLane){cap.push(`<i class="lt lane-${pc.lane}">走 ${pc.lane} 路</i>`);lastLane=pc.lane;}cap.push(`${pc.k}×${pc.n}<small>（${seatRange(pc.nos)}）</small>`);}
  if(empt.length)cap.push(`<span class="emp">空 ${empt.length}</span><small>（${seatRange(empt)}）</small>`);
  return `<div class="row" data-row="${r.pai}"><div class="rl"><b>第 ${r.pai} 排</b><small>${r.seats.length} 人${empt.length?`<br>空 ${empt.length}`:''}</small></div><div class="band" style="width:${(tot(r)/maxTot*100).toFixed(2)}%" aria-hidden="true">${band}</div><p class="cap">${cap.join('<span class="sep">·</span>')}</p></div>`+(hand.get(r.pai)||[]).join('');}).join('');
 const usedPai=new Set(e.rows.map(r=>r.pai)),unused=[...S.usable.keys()].filter(p=>!usedPai.has(p)).sort((a,b)=>b-a);
 const r0=e.rows[0];
 $('rows').innerHTML=`<h2>帶隊順序 · 由上排往下</h2><p class="how">本出口 ${e.used} 人依序從第 ${r0.pai} 排帶起，每排由出口側 ${r0.seats[0]} 號往 ${r0.seats[r0.seats.length-1]} 號方向；一排走完接下一排。色帶寬度依座位數，每格一席，底線顏色是走哪一路。</p><div class="dir"><span>出口側（先走）</span><span>中央</span></div>${rowsHtml}${unused.length?`<p class="unused">第 ${unused.join('、')} 排未使用（${unused.reduce((a,p)=>a+S.usable.get(p).length,0)} 席空）。</p>`:''}`;
 $('legend').innerHTML=ds.groups.map(g=>{const p={costume:g.costume,dadui:g.dadui};return `<span><i style="background:${colorOf(p)}"></i>${g.key}</span>`;}).join('')+`<span><i style="background:var(--grid)"></i>空席</span><span><i style="background:var(--keep)"></i>保留不坐</span><span><i style="background:var(--dead)"></i>不可用／工作席</span><span><i class="cur"></i>目前出口 ${key}</span>`;
}
// 色帶小格放不下字時藏起來（說明列仍完整列出）
function fitLabels(){for(const pc of $('rows').querySelectorAll('.pc')){const lb=pc.firstElementChild;pc.classList.remove('tight');if(lb.offsetWidth>pc.clientWidth-2)pc.classList.add('tight');}}

// ---------- 座位圖 ----------
const cv=$('seatmap'),sc=$('mapscroll');
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawMap(scrollTo=false){if(!ds)return;
 const DEG=.26,units=(TH.max-TH.min)/DEG+1,padL=30,padR=30,top=40,bot=8;
 const avail=Math.max(200,sc.clientWidth),fit=(avail-padL-padR)/units;
 const cell=zoom?10:(fit>=5?Math.min(12,fit):9),ch=Math.max(cell,7)*1.1;
 const W=Math.ceil(units*cell+padL+padR),H=Math.ceil(top+PAI_MAX*ch+bot),dpr=Math.min(2,devicePixelRatio||1);
 cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
 const col={grid:cssVar('--grid'),dead:cssVar('--dead'),keep:cssVar('--keep'),dim:cssVar('--dim'),ink:cssVar('--ink'),accent:cssVar('--accent')};
 const F='"Noto Sans TC",system-ui,sans-serif',X=th=>padL+(th-TH.min)/DEG*cell,Y=pai=>top+(PAI_MAX-pai)*ch;
 cells=[];cellMap.clear();
 c.font=`500 10px ${F}`;c.fillStyle=col.dim;c.textBaseline='middle';
 for(let pai=1;pai<=PAI_MAX;pai++){if(ch<11&&![1,5,10,14].includes(pai))continue;c.textAlign='right';c.fillText(pai,padL-4,Y(pai)+ch/2);c.textAlign='left';c.fillText(pai,W-padR+4,Y(pai)+ch/2);}
 c.textAlign='right';c.fillText('排',padL-4,top-8);
 for(const sec of SECS){const S=SEC[sec],xs=X(S.thMin),xe=X(S.thMax)+cell,isCur=sec===cur;
  if(isCur){c.strokeStyle=col.accent;c.lineWidth=2;rrect(c,xs-3,top-3,xe-xs+6,PAI_MAX*ch+6,5);c.stroke();}
  c.fillStyle=isCur?col.accent:col.ink;c.font=`${isCur?900:700} 13px ${F}`;c.textAlign='center';c.textBaseline='alphabetic';c.fillText(`${sec} 區`,(xs+xe)/2,15);
  if(S.exitRight!==undefined){c.fillStyle=col.accent;c.font=`700 10px ${F}`;const y=29;
   if(S.exitRight){c.textAlign='right';c.fillText('出口',xe-7,y);c.beginPath();c.moveTo(xe-5,y-8);c.lineTo(xe,y-4);c.lineTo(xe-5,y);c.fill();}
   else{c.textAlign='left';c.fillText('出口',xs+7,y);c.beginPath();c.moveTo(xs+5,y-8);c.lineTo(xs,y-4);c.lineTo(xs+5,y);c.fill();}}
  c.globalAlpha=isCur?1:.6;
  for(const s of S.seats){const x=X(s.theta),y=Y(s.pai),w=Math.max(1,cell-1),h=ch-1;
   c.fillStyle=(s.kind==='blocked'||s.kind==='work')?col.dead:s.who?colorOf(ds.byId.get(s.who)):s.reserved?col.keep:col.grid;c.fillRect(x,y,w,h);
   const rec={x,y,w,h,s};cells.push(rec);cellMap.set(`${s.sec}-${s.pai}-${s.no}`,rec);}
  c.globalAlpha=1;}
 if(sel){const rec=cellMap.get(sel);if(rec){c.strokeStyle=col.ink;c.lineWidth=2;c.strokeRect(rec.x-1.5,rec.y-1.5,rec.w+3,rec.h+3);}}
 if(scrollTo&&SEC[ds.exitsByKey[cur].sec]){const S=SEC[ds.exitsByKey[cur].sec],xs=X(S.thMin),xe=X(S.thMax)+cell;if(xs<sc.scrollLeft||xe>sc.scrollLeft+sc.clientWidth)sc.scrollLeft=Math.max(0,xs-24);}}
function showTip(s){sel=`${s.sec}-${s.pai}-${s.no}`;const where=`${s.sec} 區 ${s.pai} 排 ${s.no} 號`;let t;
 if(s.kind==='blocked')t=`${where} · 不可用席`;else if(s.kind==='work')t=`${where} · 工作席，不排人`;
 else if(!s.who)t=s.reserved?`${where} · 保留不坐`:`${where} · 空席`;
 else{const p=ds.byId.get(s.who);t=`${where} · <b>${p.id}</b> · 大隊 ${p.dadui}${p.costume} · 走 ${p.lane} 路 · ${p.exit} 出口第 ${p.exitSeq+1} 位 · ${fmt(p.t.leave)} 離座`;}
 $('seat-tip').innerHTML=t+(s.sec!==cur?` <a href="?e=${s.sec}" data-go="${s.sec}">看 ${s.sec} 出口</a>`:'');drawMap();}
cv.addEventListener('click',ev=>{const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=null,bd=Infinity;
 for(const rec of cells){const dx=Math.max(rec.x-x,0,x-(rec.x+rec.w)),dy=Math.max(rec.y-y,0,y-(rec.y+rec.h)),d=dx*dx+dy*dy;if(d<bd){bd=d;best=rec;}}
 if(best&&bd<=36)showTip(best.s);});
$('seat-tip').onclick=ev=>{const a=ev.target.closest('[data-go]');if(a){ev.preventDefault();choose(a.dataset.go);}};
$('zoom').onclick=()=>{zoom=!zoom;$('zoom').setAttribute('aria-pressed',String(zoom));$('zoom').textContent=zoom?'縮小':'放大';drawMap();};
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawMap();fitLabels();},80);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawMap());
window.__seatXY=(sec,pai,no)=>{const r=cellMap.get(`${sec}-${pai}-${no}`);return r?[r.x+r.w/2,r.y+r.h/2]:null;};

(async()=>{try{ds=await Dome.fetchData();if(!ds){$('head').innerHTML='<p class="err">讀不到動線資料</p>';return;}}catch(e){$('head').innerHTML=`<p class="err">${esc(e.message)}</p>`;return;}
 buildIdx();picker();
 const q=new URLSearchParams(location.search).get('e');
 choose(ds.exitsByKey[q]?q:ds.exits[0].key,false);
 window.__dome_ready=true;})();
</script>
</body>
