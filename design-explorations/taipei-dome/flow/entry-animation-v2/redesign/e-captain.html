<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大隊長口令卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#141a1c;--card:#1d2528;--ink:#f1f3ef;--dim:#a3b0ae;--rule:#2d383b;--team:#e05d63;--team-ink:#1a0d0e;--white:#f3eee4;--blue:#5a9be8;--good:#7fc8f8;--bad:#f2a07b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
::selection{background:var(--team);color:var(--team-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--team);outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:14px max(16px,env(safe-area-inset-left)) 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--dim);text-decoration:none;font-size:14px}
.vswitch{display:inline-flex;background:var(--card);border-radius:10px;padding:3px}
.vswitch button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--dim)}
.vswitch button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.pick{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin:14px 0 16px}
.pick button{border:1.5px solid var(--rule);background:var(--card);border-radius:12px;height:52px;font-size:20px;font-weight:900;position:relative}
.pick button i{position:absolute;left:50%;bottom:7px;width:16px;height:3px;border-radius:2px;transform:translateX(-50%)}
.pick button[aria-pressed=true]{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.pick button[aria-pressed=true] i{background:var(--team-ink)!important}
.grid{display:grid;gap:14px}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.next{background:var(--team);color:var(--team-ink);border-radius:22px;padding:20px 22px 22px;transition:background .3s}
.next small{font-size:15px;font-weight:700}
.next h1{margin:2px 0 4px;font-size:clamp(30px,7vw,46px);line-height:1.15;font-weight:900;letter-spacing:.01em}
.next p{margin:0;font-size:17px;font-weight:500}
.next .count{font-size:clamp(44px,10vw,72px);font-weight:900;line-height:1;margin-top:12px;letter-spacing:-.02em}
.next .count span{font-size:16px;font-weight:700;letter-spacing:0;margin-left:6px}
.card{background:var(--card);border-radius:18px;padding:16px 18px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--dim);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.lanes{display:grid;gap:9px}
.lane{display:grid;grid-template-columns:76px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.lane b{font-size:15px}
.lane .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--rule)}
.lane .bar i{height:100%}
.lane .st{text-align:right;color:var(--dim);font-size:13px}
.lane .st.ok{color:var(--team);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:12px}
.legend span{display:flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px}
ol.cues{list-style:none;margin:0;padding:0}
.cues li{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--rule);color:var(--dim)}
.cues.cmp li{grid-template-columns:58px 58px 1fr auto}
.cues li.head{font-size:12px;border-top:0;padding-top:0}
.cues li:first-child{border-top:0}
.cues li time{font-weight:700}
.cues li .old{font-weight:400}
.cues li .d{font-size:13px;font-weight:700;text-align:right}
.cues li .d.good{color:var(--good)}.cues li .d.bad{color:var(--bad)}
.cues li.done span.h{text-decoration:line-through;text-decoration-color:var(--rule);text-decoration-thickness:2px}
.cues li.cur{color:var(--ink)}.cues li.cur time:not(.old){color:var(--team)}
canvas{display:block;width:100%;height:300px;border-radius:12px}
.deck{display:flex;gap:10px;align-items:center;margin-top:14px}
.deck button.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.deck input{flex:1;accent-color:var(--team)}
.deck output{min-width:52px;text-align:right;font-weight:700}
.sum{font-size:14px;color:var(--dim);margin:8px 0 0}
.sum b{color:var(--ink)}
@media(max-width:520px){.pick{gap:4px}.pick button{height:46px;font-size:17px;border-radius:10px}.lane{grid-template-columns:64px 1fr 56px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="top"><a class="back" href="index.html">‹ 版本 2 新設計</a><div id="vs"></div></div>
<div class="pick" id="pick" role="group" aria-label="選擇大隊"></div>
<div class="grid two">
 <div class="grid">
  <section class="next" aria-live="polite"><small id="nx-k">讀取動線資料…</small><h1 id="nx-h"></h1><p id="nx-d"></p><div class="count" id="nx-c"></div></section>
  <section class="card"><h2 id="lanes-h">六列狀態</h2><div class="lanes" id="lanes"></div>
   <div class="legend"><span><i style="background:#56636a"></i>休息區</span><span><i style="background:var(--dim)"></i>走廊／樓梯</span><span><i style="background:var(--team);opacity:.55"></i>集結等待</span><span><i style="background:var(--team)"></i>進場中</span><span><i style="background:var(--ink)"></i>到位</span></div>
   <div class="deck"><button class="play" id="play" aria-label="播放"><svg width="14" height="16" viewBox="0 0 14 16" id="ico"><path d="M1 1v14l12-7z" fill="currentColor"/></svg></button><input type="range" id="tl" min="0" step=".1" aria-label="模擬時間"><output id="clk"></output></div>
  </section>
 </div>
 <div class="grid" style="align-content:start">
  <section class="card"><h2><span>口令表</span><span id="cue-v"></span></h2><ol class="cues" id="cues"></ol><p class="sum" id="sum"></p></section>
  <section class="card" style="padding:8px"><canvas id="c" aria-label="本大隊位置圖"></canvas></section>
 </div>
</div>
</div>
<script src="core.js"></script>
<script>
'use strict';
const {pos,state,counts,fmt,delta,View}=Dome,$=id=>document.getElementById(id);
const TEAM=['#e05d63','#d9ae3a','#79c25a','#b688dd','#f0a050','#bfc35a','#e586bd','#c9945e','#4fc2b4'];
let k=5,t=0,playing=false,last=0,dirty=true,cues=[],lanes=[],sets=[],ds=null;
$('pick').innerHTML=TEAM.map((c,i)=>`<button data-k="${i+1}" aria-pressed="${i+1===k}">${i+1}<i style="background:${c}"></i></button>`).join('');
$('pick').onclick=e=>{const b=e.target.closest('button');if(b)choose(+b.dataset.k);};
const minT=(ps,key)=>Math.min(...ps.map(p=>p.t[key])),maxT=(ps,key)=>Math.max(...ps.map(p=>p.t[key]));
// 口令以 id 定義，方便兩版逐條對照；集結區依該版實際分區各自一條
function cuesFor(d){const ps=d.P.filter(p=>p.dadui===k),prev=d.P.filter(p=>p.dadui===k-1),spots=[...new Set(ps.map(p=>p.assembly))];
 const one=spots.length===1;
 return [
  {id:'l0',t:minT(ps,'leave'),h:'第一位離座',d:'休息區開始有人起身'},
  {id:'l1',t:maxT(ps,'leave'),h:'最後一位離座',d:'休息區清空，殿後幹部跟上'},
  ...spots.map(s=>{const g=ps.filter(p=>p.assembly===s),c=[...new Set(g.map(p=>p.costume))];return {id:'a-'+c.join(''),t:maxT(g,'assembly'),h:one?'六列到齊':`${c.join('')}衣到齊`,d:`${d.nodeName(s)} ${one?'三白三藍':'三列'}湊齊`};}),
  ...(prev.length?[{id:'p',t:maxT(prev,'gate'),h:`大隊 ${k-1} 最後一位過西一入口`,d:'西一入口交接給本大隊'}]:[]),
  {id:'go',t:minT(ps,'enter'),h:`大隊 ${k} 出發`,d:one?'六列並排往西一入口，左右順序不變':'白衣、藍衣各自出發，在西一入口會合成六路'},
  {id:'g1',t:maxT(ps,'gate'),h:'最後一位過西一入口',d:k<9?`交給大隊 ${k+1}`:'最後一個大隊'},
  {id:'ok',t:maxT(ps,'arrive'),h:'全隊到位',d:'回報到位'},
 ].sort((a,b)=>a.t-b.t);}
function choose(n){k=n;document.documentElement.style.setProperty('--team',TEAM[k-1]);$('pick').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===k));
 if(!ds)return;const ps=ds.P.filter(p=>p.dadui===k),cmp=sets.length>1;
 lanes=[...new Set(ps.map(p=>p.lie))].sort((a,b)=>a-b).map(lie=>({lie,ps:ps.filter(p=>p.lie===lie)}));
 cues=cuesFor(ds);const old=cmp?new Map(cuesFor(sets[0]).map(c=>[c.id,c])):null;
 $('cues').className='cues'+(cmp?' cmp':'');$('cue-v').textContent=cmp?'版本 1 → 版本 2':ds.label;
 $('cues').innerHTML=(cmp?`<li class="head"><span>版本 1</span><span>版本 2</span><span></span><span>差</span></li>`:'')+cues.map(c=>{const o=old&&(old.get(c.id)||(c.id.startsWith('a-')?[...old.values()].find(x=>x.id.startsWith('a-')&&(x.id.includes(c.id.slice(2))||c.id.includes(x.id.slice(2)))):null)),dv=o?c.t-o.t:0;
  return `<li data-t="${c.t}">${cmp?`<time class="old">${o?fmt(o.t):'—'}</time>`:''}<time>${fmt(c.t)}</time><span class="h">${c.h}</span>${cmp?`<span class="d ${!o||Math.abs(dv)<1?'':dv<0?'good':'bad'}">${o?delta(dv):'新'}</span>`:'<span></span>'}</li>`;}).join('');
 // 對照摘要：這個大隊在版本 2 的等待與到位差
 if(cmp){const ps1=sets[0].P.filter(p=>p.dadui===k),w=(l,d)=>l.reduce((a,p)=>a+d.wait(p),0)/l.length,w1=w(ps1,sets[0]),w2=w(ps,ds);
  $('sum').innerHTML=`平均集結等待 ${fmt(w1)} → <b>${fmt(w2)}</b>（${delta(w2-w1)}）；全隊到位 ${fmt(maxT(ps1,'arrive'))} → <b>${fmt(maxT(ps,'arrive'))}</b>。`;}else $('sum').textContent='';
 $('lanes-h').textContent=`大隊 ${k} · 六列狀態`;
 $('tl').min=Math.max(0,cues[0].t-10);$('tl').max=Math.min(ds.T_END,cues[cues.length-1].t+5);t=+$('tl').min;
 v.fit(Dome.bounds(ps.flatMap(p=>p.path.map(q=>[q[0],q[1]])),.6));dirty=true;}
const v=new View($('c'),{pad:10});v.onresize=()=>{dirty=true;};
const ST=[['seated','#56636a'],['walk','#a3b0ae'],['wait','TEAMA'],['enter','TEAM'],['done','#f1f3ef']];
function draw(){const team=TEAM[k-1],ps=ds.P.filter(p=>p.dadui===k),D=ds.D;
 $('lanes').innerHTML=lanes.map(l=>{const c=counts(t,l.ps),n=l.ps.length,c0=l.ps[0].costume,ok=c.done===n?'到位':c.wait===n?'到齊':'';
  return `<div class="lane"><b>列 ${l.lie}</b><div class="bar">${ST.map(([s,col])=>`<i style="width:${c[s]/n*100}%;background:${col==='TEAM'?team:col==='TEAMA'?team+'8c':col}"></i>`).join('')}</div><span class="st ${ok?'ok':''}">${ok||c0+'衣 '+n}</span></div>`;}).join('');
 const i=cues.findIndex(c=>c.t>t),nx=cues[i<0?cues.length-1:i];
 $('nx-k').textContent=i<0?'全隊完成':`下一個口令 · ${fmt(nx.t)}${sets.length>1?' · '+ds.label:''}`;$('nx-h').textContent=nx.h;$('nx-d').textContent=nx.d;
 $('nx-c').innerHTML=i<0?'完成':`${fmt(nx.t-t)}<span>後</span>`;
 $('cues').querySelectorAll('li[data-t]').forEach((li,j)=>{li.classList.toggle('done',cues[j].t<=t);li.classList.toggle('cur',j===i);});
 $('clk').textContent=fmt(t);$('tl').value=t;
 const c=v.begin('#11171a');v.base(D.map,{floor:'#1a2326',stage:'#263236',wall:'#2d383b',band:'#a3b0ae',bandA:.07,stand:'#2d383b',gate:'#f1f3ef',gateA:.1});
 const r=Math.max(1.1,.045*v.s);c.globalAlpha=.25;for(const p of ds.P){if(p.dadui===k)continue;const q=pos(p,t);v.dot(q[0],q[1],r*.7,'#56636a');}c.globalAlpha=1;
 for(const p of ps){const q=pos(p,t);v.dot(q[0],q[1],r,p.costume==='白'?'#f3eee4':team);}
 v.text(D.nodes.GATE6.label,D.nodes.GATE6.X,D.nodes.GATE6.Y,{color:'#f1f3ef',size:13,weight:900,halo:'#11171a',align:'right',dx:-12});}
function setIco(){$('ico').innerHTML=playing?'<rect x="1" y="1" width="4" height="14" fill="currentColor"/><rect x="9" y="1" width="4" height="14" fill="currentColor"/>':'<path d="M1 1v14l12-7z" fill="currentColor"/>';$('play').setAttribute('aria-label',playing?'暫停':'播放');}
$('play').onclick=()=>{playing=!playing;if(playing&&t>=+$('tl').max)t=+$('tl').min;last=0;setIco();};
$('tl').oninput=e=>{t=+e.target.value;dirty=true;};
async function setVersion(m){const got=await Dome.fetchSets(m);if(!got)return;sets=got;ds=sets[sets.length-1];choose(k);}
function frame(n){if(ds){if(playing){if(last)t=Math.min(+$('tl').max,t+(n-last)/1000*6);last=n;dirty=true;if(t>=+$('tl').max){playing=false;setIco();}}if(v.step(n))dirty=true;if(dirty){draw();dirty=false;}}requestAnimationFrame(frame);}
Dome.switcher($('vs'),Dome.mode(),setVersion);setVersion(Dome.mode());requestAnimationFrame(frame);
window.__seek=x=>{t=x;dirty=true;};
</script>
</body>
</html>
