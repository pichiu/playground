<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六格講義</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--paper:#ffffff;--ink:#24211c;--dim:#655f55;--rule:#d9d6cc;--blue:#1d4f91;--floor:#efeee9;--rust:#a8461d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.sheet{max-width:1400px;margin:auto;padding:24px max(16px,env(safe-area-inset-left)) 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--dim);text-decoration:none;font-size:13px}
.vswitch{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.vswitch button{font:inherit;font-size:14px;border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--ink)}
.vswitch button+button{border-left:1px solid var(--ink)}
.vswitch button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding:18px 0 14px;margin-bottom:22px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,4.4vw,54px);line-height:1.1;margin:0;letter-spacing:.02em}
.ver{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin:8px 0 0}
.mast p{margin:8px 0 0;color:var(--dim);max-width:62ch}
.mast .print{font:inherit;background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:10px 16px;cursor:pointer}
.key{display:flex;gap:18px;font-size:13px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.key span{display:flex;align-items:center;gap:6px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}
.cmp .frames{grid-template-columns:repeat(2,minmax(0,1fr))}
figure{margin:0}
.pair{display:grid;grid-template-columns:1fr;border-top:1px solid var(--rule)}
.cmp .pair{grid-template-columns:1fr 1fr;gap:6px}
.pair div{position:relative}
.pair b{position:absolute;left:4px;top:4px;font-size:12px;font-weight:700;color:var(--dim)}
figure canvas{display:block;width:100%;aspect-ratio:4/3;background:var(--paper)}
figcaption{padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
figcaption time{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;line-height:1;grid-row:span 2}
figcaption h2{margin:0;font-family:"Noto Serif TC",serif;font-size:18px;line-height:1.3}
figcaption p{margin:0;font-size:14px;color:var(--dim)}
figcaption table{grid-column:1/-1;font-size:13px;color:var(--dim);border-top:1px solid var(--rule);margin-top:8px;border-collapse:collapse;width:100%}
figcaption td,figcaption th{padding:4px 0;text-align:right;font-weight:400}
figcaption th{text-align:right;font-size:12px}figcaption tr>th:first-child{text-align:left}
figcaption td b{color:var(--ink)}
figcaption .n{grid-column:1/-1;font-size:13px;color:var(--dim);border-top:1px solid var(--rule);margin-top:8px;padding-top:6px;display:flex;gap:14px;flex-wrap:wrap}
figcaption .n b{color:var(--ink)}
.foot{margin-top:28px;border-top:1px solid var(--rule);padding-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:980px){.frames{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp .frames{grid-template-columns:1fr}}
@media(max-width:620px){.frames{grid-template-columns:1fr}.mast{grid-template-columns:1fr}}
@page{size:A3 landscape;margin:12mm}
@media print{.back,.print,.vswitch{display:none}.sheet{max-width:none;padding:0}.frames{grid-template-columns:repeat(3,1fr);gap:8mm}.cmp .frames{grid-template-columns:repeat(2,1fr)}body{font-size:10pt}}
</style>
</head>
<body>
<div class="sheet" id="sheet">
<div class="top"><a class="back" href="index.html">‹ 五個方向</a><div id="vs"></div></div>
<header class="mast">
 <div>
  <h1>六個瞬間，看懂一次進場</h1>
  <p class="ver" id="ver"></p>
  <p id="intro">西一＋桃竹 1,609 人，從休息區到身分證位置。每格是同一時刻的全體位置；細線是之前 8 秒走過的路，所以不用播放也看得出往哪裡走。</p>
  <div class="key"><span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="#24211c" stroke-width="1.4"/></svg>白衣</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#1d4f91"/></svg>藍衣</span><span><svg width="22" height="8"><path d="M1 4h20" stroke="#a8461d" stroke-width="1.5"/></svg>前 8 秒軌跡</span></div>
 </div>
 <button class="print" onclick="print()">列印 A3</button>
</header>
<section class="frames" id="frames"></section>
<p class="foot"><span>動線為示意，實際依企劃現場指示。時間為動畫節奏，不是實際分鐘數。</span><span>北朝上 · 甲舞台在左</span></p>
</div>
<script src="core.js"></script>
<script>
'use strict';
const {pos,state,counts,fmt,View}=Dome,$=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const C={};for(const n of ['paper','ink','dim','rule','blue','floor','rust'])C[n]=css(n);
const FRAME=[-15.2,-11.2,1.5,11.6];
const wave=(ds,w)=>Math.min(...ds.P.filter(p=>p.exitWave===w).map(p=>p.t.leave));
const dStart=(ds,k)=>Math.min(...ds.P.filter(p=>p.dadui===k).map(p=>p.t.enter));
// 每版各自的六個關鍵時刻與說明；說明照該版 meta.rules 的排法寫
const MOMENTS={
 1:ds=>[
  {t:wave(ds,1)+20,h:'第一出離座',d:'139–145 區的前段人先動，先出來的是大隊 5。三條鏈各走一路，走廊上同時最多三條隊伍。'},
  {t:wave(ds,2)+25,h:'集結點開始成形',d:'大隊 1–5 下樓梯到 B2 集結點 1–5；6–9 在 B1 西側走廊，大隊 6 白衣在樓梯與平台。'},
  {t:dStart(ds,1)-1,h:'大隊 1 準備進場',d:'集結點 1 的六列已湊齊三白三藍，頭朝 6口。'},
  {t:dStart(ds,3)+8,h:'6口 六路並排',d:'大隊依 1→9 依序進；沿牆到西南角，再沿排 1 外側通道北上。'},
  {t:dStart(ds,6)+10,h:'B 組下樓',d:'大隊 6 白衣三列先下樓梯，藍衣跟著；場內隊形已填過半。'},
  {t:ds.T_END,h:'全員到位',d:'1,609 人全部站在身分證位置。'}],
 2:ds=>[
  {t:wave(ds,1)+20,h:'第一出離座',d:'先出來的是大隊 8、9 的藍衣，直接下樓梯，走到 B2 最遠的集結區。'},
  {t:wave(ds,2)+25,h:'藍衣下 B2、白衣留 B1',d:'藍衣在 B2 兩隊一區（藍 2·3／4·5／6·7／8·9）；白衣留在 B1，白 2 在樓梯。'},
  {t:dStart(ds,1)-1,h:'大隊 1 準備進場',d:'集結區 1 的三白三藍湊齊，頭朝 6口。'},
  {t:dStart(ds,3)+8,h:'6口 會合成六路',d:'白衣從 B1 下樓、藍衣從 B2 過來，每個大隊在 6口 會合成六路。'},
  {t:dStart(ds,6)+10,h:'後段大隊會合',d:'藍衣早已在 B2 等候，白衣下樓後才會合；場內隊形已填過半。'},
  {t:ds.T_END,h:'全員到位',d:'1,609 人全部站在身分證位置。'}],
};
let sets=[],jobs=[];
async function setVersion(m){try{sets=m==='cmp'?await Promise.all([Dome.load(1),Dome.load(2)]):[await Dome.load(+m)];}catch(e){Dome.fail($('frames'),e);return;}
 const cmp=sets.length>1;document.body.classList.toggle('cmp',cmp);
 $('ver').textContent=cmp?'版本 1 對照版本 2 · 同一時刻左右並排':`${sets[0].label} · ${sets[0].sub}`;
 // 對照：同一個絕對時刻，兩版並排；時刻取兩版共同的節點
 let F;if(cmp){const [a,b]=sets;F=[[wave(a,2)+25,'第二出離座中'],[dStart(b,1)-1,'版本 2 大隊 1 出發前'],[dStart(a,1)+20,'版本 1 大隊 1 進場中'],[dStart(a,5)+5,'版本 1 大隊 5 出發'],[b.T_END,'版本 2 全員到位'],[a.T_END,'版本 1 全員到位']].map(([t,h])=>({t,h})).sort((x,y)=>x.t-y.t);}
 else F=MOMENTS[sets[0].v](sets[0]);
 const frames=$('frames');frames.innerHTML='';jobs=[];
 for(const f of F){const fig=document.createElement('figure'),pair=document.createElement('div');pair.className='pair';fig.append(pair);
  sets.forEach(ds=>{const box=document.createElement('div'),cv=document.createElement('canvas');cv.setAttribute('aria-label',`${ds.label} ${fmt(f.t)}`);box.append(cv);if(cmp)box.insertAdjacentHTML('beforeend',`<b>${ds.label}</b>`);pair.append(box);jobs.push({cv,ds,t:f.t});});
  const cs=sets.map(ds=>counts(f.t,ds.P));
  const nums=cmp?`<table><tr><th></th><th>休息區</th><th>移動</th><th>集結</th><th>到位</th></tr>${sets.map((ds,i)=>`<tr><th>${ds.label}</th><td><b>${cs[i].seated}</b></td><td><b>${cs[i].walk+cs[i].enter}</b></td><td><b>${cs[i].wait}</b></td><td><b>${cs[i].done}</b></td></tr>`).join('')}</table>`
   :`<div class="n"><span>休息區 <b>${cs[0].seated}</b></span><span>移動 <b>${cs[0].walk+cs[0].enter}</b></span><span>集結 <b>${cs[0].wait}</b></span><span>到位 <b>${cs[0].done}</b></span></div>`;
  fig.insertAdjacentHTML('beforeend',`<figcaption><time>${fmt(f.t)}</time><h2>${f.h}</h2><p>${f.d||''}</p>${nums}</figcaption>`);frames.append(fig);}
 for(const j of jobs){j.v=new View(j.cv,{pad:6});j.v.onresize=()=>paint(j);}
 await document.fonts.ready;jobs.forEach(paint);}
function paint({v,ds,t}){v.fit(FRAME,true);const c=v.begin(C.paper),D=ds.D,r=Math.max(.9,.04*v.s);
 v.base(D.map,{floor:C.floor,stage:C.rule,wall:C.rule,band:C.dim,bandA:.08,stand:C.rule});
 c.globalAlpha=.7;c.lineCap='round';
 for(const p of ds.P){const st=state(p,t);if(st!=='walk'&&st!=='enter')continue;const pts=p.path.filter(q=>q[2]>t-8&&q[2]<t).flatMap(q=>[q[0],q[1]]),a=pos(p,Math.max(0,t-8)),b=pos(p,t);v.stroke([a[0],a[1],...pts,b[0],b[1]],C.rust,.6);}
 c.globalAlpha=1;
 for(const p of ds.P){const q=pos(p,t);if(p.costume==='白')v.dot(q[0],q[1],r,C.paper,C.ink,.7);else v.dot(q[0],q[1],r,C.blue);}
 v.text('6口',D.nodes.GATE6.X,D.nodes.GATE6.Y,{color:C.ink,size:11,weight:700,halo:C.paper,dx:-16,font:'"Noto Serif TC",serif'});
 v.text('甲舞台',-6.3,0,{color:C.dim,size:11,font:'"Noto Serif TC",serif'});}
Dome.switcher($('vs'),Dome.mode(),setVersion);setVersion(Dome.mode());
window.__seek=()=>{};
</script>
</body>
</html>
