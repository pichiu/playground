<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六格講義</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--paper:#ffffff;--ink:#24211c;--dim:#655f55;--rule:#d9d6cc;--blue:#1d4f91;--floor:#efeee9;--rust:#a8461d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.sheet{max-width:1400px;margin:auto;padding:24px max(16px,env(safe-area-inset-left)) 48px}
.back{color:var(--dim);text-decoration:none;font-size:13px}
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding:18px 0 14px;margin-bottom:22px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,4.4vw,54px);line-height:1.1;margin:0;letter-spacing:.02em}
.mast p{margin:8px 0 0;color:var(--dim);max-width:60ch}
.mast .print{font:inherit;background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:10px 16px;cursor:pointer}
.key{display:flex;gap:18px;font-size:13px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.key span{display:flex;align-items:center;gap:6px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px;counter-reset:f}
figure{margin:0}
figure canvas{display:block;width:100%;aspect-ratio:4/3;background:var(--paper);border-top:1px solid var(--rule)}
figcaption{padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
figcaption time{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;line-height:1;grid-row:span 2}
figcaption h2{margin:0;font-family:"Noto Serif TC",serif;font-size:18px;line-height:1.3}
figcaption p{margin:0;font-size:14px;color:var(--dim)}
figcaption .n{grid-column:1/-1;font-size:13px;color:var(--dim);border-top:1px solid var(--rule);margin-top:8px;padding-top:6px;display:flex;gap:14px;flex-wrap:wrap}
figcaption .n b{color:var(--ink)}
.foot{margin-top:28px;border-top:1px solid var(--rule);padding-top:10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:980px){.frames{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.frames{grid-template-columns:1fr}.mast{grid-template-columns:1fr}}
@page{size:A3 landscape;margin:12mm}
@media print{.back,.print{display:none}.sheet{max-width:none;padding:0}.frames{grid-template-columns:repeat(3,1fr);gap:8mm}body{font-size:10pt}}
</style>
</head>
<body>
<div class="sheet">
<a class="back" href="index.html">‹ 五個方向</a>
<header class="mast">
 <div>
  <h1>六個瞬間，看懂一次進場</h1>
  <p>西一＋桃竹 1,609 人，從休息區到身分證位置。每格是同一時刻的全體位置；細線是之前 8 秒走過的路，所以不用播放也看得出往哪裡走。</p>
  <div class="key"><span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="#24211c" stroke-width="1.4"/></svg>白衣</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#1d4f91"/></svg>藍衣</span><span><svg width="22" height="8"><path d="M1 4h20" stroke="#a8461d" stroke-width="1.5"/></svg>前 8 秒軌跡</span></div>
 </div>
 <button class="print" onclick="print()">列印 A3</button>
</header>
<section class="frames" id="frames"></section>
<p class="foot"><span>動線為示意，實際依企劃現場指示。時間為動畫節奏，不是實際分鐘數。</span><span>北朝上 · 甲舞台在左</span></p>
</div>
<script src="data.js"></script><script src="core.js"></script>
<script>
'use strict';
const {D,P,T_END,pos,state,counts,B,fmt,View}=Dome;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const C={};for(const n of ['paper','ink','dim','rule','blue','floor','rust'])C[n]=css(n);
const wave=w=>Math.min(...P.filter(p=>p.exitWave===w).map(p=>p.t.leave));
const dStart=k=>Math.min(...P.filter(p=>p.dadui===k).map(p=>p.t.enter));
const F=[
 {t:wave(1)+20,h:'第一出離座',d:'139–145 區的前段人先動。三條鏈各走一路，走廊上同時最多三條隊伍。'},
 {t:wave(2)+25,h:'集結點開始成形',d:'大隊 1–5 下樓梯到 B2 集結點 1–5；6–9 在 B1 西側走廊，大隊 6 白衣在樓梯與平台。'},
 {t:dStart(1)-1,h:'大隊 1 準備進場',d:'集結點 1 的六列已湊齊三白三藍，頭朝 6口。'},
 {t:dStart(3)+8,h:'6口 六路並排',d:'大隊依 1→9 依序進；沿牆到西南角，再沿排 1 外側通道北上。'},
 {t:dStart(6)+10,h:'B 組下樓',d:'大隊 6 白衣三列先下樓梯，藍衣跟著；場內隊形已填過半。'},
 {t:T_END,h:'全員到位',d:'1,609 人全部站在身分證位置。'},
];
const frames=document.getElementById('frames');
F.forEach((f,i)=>{const fig=document.createElement('figure'),cv=document.createElement('canvas'),c=counts(f.t);cv.setAttribute('aria-label',`${fmt(f.t)} ${f.h}`);
 fig.append(cv);fig.insertAdjacentHTML('beforeend',`<figcaption><time>${fmt(f.t)}</time><h2>${f.h}</h2><p>${f.d}</p><div class="n"><span>休息區 <b>${c.seated}</b></span><span>移動 <b>${c.walk+c.enter}</b></span><span>集結 <b>${c.wait}</b></span><span>到位 <b>${c.done}</b></span></div></figcaption>`);frames.append(fig);f.cv=cv;});
const views=F.map(f=>{const v=new View(f.cv,{pad:6});v.onresize=()=>paint(v,f);return v;});
const FRAME=[-15.2,-11.2,1.5,11.6];
function paint(v,f){v.fit(FRAME,true);const c=v.begin(C.paper),t=f.t,r=Math.max(.9,.04*v.s);
 v.base({floor:C.floor,stage:C.rule,wall:C.rule,band:C.dim,bandA:.08,stand:C.rule});
 c.globalAlpha=.7;c.lineCap='round';
 for(const p of P){const st=state(p,t);if(st!=='walk'&&st!=='enter')continue;const pts=p.path.filter(q=>q[2]>t-8&&q[2]<t).flatMap(q=>[q[0],q[1]]),a=pos(p,Math.max(0,t-8)),b=pos(p,t);v.stroke([a[0],a[1],...pts,b[0],b[1]],C.rust,.6);}
 c.globalAlpha=1;
 for(const p of P){const q=pos(p,t);if(p.costume==='白')v.dot(q[0],q[1],r,C.paper,C.ink,.7);else v.dot(q[0],q[1],r,C.blue);}
 v.text('6口',D.nodes.GATE6.X,D.nodes.GATE6.Y,{color:C.ink,size:11,weight:700,halo:C.paper,dx:-16,font:'"Noto Serif TC",serif'});
 v.text('甲舞台',-6.3,0,{color:C.dim,size:11,font:'"Noto Serif TC",serif'});}
document.fonts.ready.then(()=>views.forEach((v,i)=>paint(v,F[i])));
window.__seek=()=>{};
</script>
</body>
</html>
