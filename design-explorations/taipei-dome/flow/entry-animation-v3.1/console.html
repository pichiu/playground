<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進場動線版本 3.1 · 指揮台</title>
<link rel="icon" href="data:,">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<script src="core.js"></script>
<style>
:root{--bg:#0d1315;--map:#0f171a;--ink:#e9efe9;--dim:#8fa29f;--faint:#3a4a4b;--line:#22302f;--floor:#152124;--white:#f5efe3;--blue:#4f93e6;--amber:#f2a73b;--amber-ink:#f2a73b;--teal:#57c3a6;--dd-blue:var(--blue);--gate:#2c4a63;--on-amber:#111;--hover:#fff;color-scheme:dark}
/* 淺色：投影在明亮會議室、或使用者在「外觀」選淺色時。白衣在淺底看不見，改沙色（與總覽、總譜同一個 --white）；琥珀當文字時加深到 4.5:1 */
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1f4f3;--map:#fafbfb;--ink:#17262b;--dim:#56656a;--faint:#b9c0bd;--line:#dcdfd8;--floor:#e9eeec;--white:#a8935e;--blue:#2f6fd0;--amber:#e08e12;--amber-ink:#9a5a00;--teal:#23907a;--dd-blue:#6f9be0;--gate:#c6d6e6;--on-amber:#111;--hover:#000;color-scheme:light}}
:root[data-theme=light]{--bg:#f1f4f3;--map:#fafbfb;--ink:#17262b;--dim:#56656a;--faint:#b9c0bd;--line:#dcdfd8;--floor:#e9eeec;--white:#a8935e;--blue:#2f6fd0;--amber:#e08e12;--amber-ink:#9a5a00;--teal:#23907a;--dd-blue:#6f9be0;--gate:#c6d6e6;--on-amber:#111;--hover:#000;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.875rem/1.5 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
::selection{background:var(--amber);color:var(--on-amber)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.stage{position:fixed;inset:var(--navh) 0 0;display:grid;grid-template-rows:1fr auto}
.maps{position:relative;min-height:0;grid-row:1;grid-column:1}
.hud{grid-row:1;grid-column:1;position:relative;pointer-events:none;min-height:0}.hud>*{pointer-events:auto}
canvas{display:block;width:100%;height:100%}
/* 頁籤與其他頁一樣固定在最上方，舞台從它下面開始 */
:root{--navh:42px}
body>.dome-nav.bar{position:fixed;top:0;left:0;right:0;height:var(--navh);z-index:5;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
body>.dome-nav.bar a{white-space:nowrap}
/* 窄螢幕導覽列橫捲時，「外觀」黏在右端，不必捲才找得到 */
body>.dome-nav.bar .dome-prefs{position:sticky;right:0;padding-left:8px;margin-right:-12px;padding-right:12px;background:var(--bg);box-shadow:-12px 0 10px -2px var(--bg)}
/* 標題區：標題、副標、圖例疊在左上角 */
.title{position:absolute;left:28px;top:22px;z-index:2;max-width:min(460px,calc(100% - 44px))}
.title h1{margin:0;font-size:1.625rem;font-weight:900;letter-spacing:.04em;line-height:1.2}
.title p{margin:2px 0 6px;color:var(--dim);font-size:0.8125rem}
.legend{margin-top:16px;display:flex;flex-direction:column;gap:6px;font-size:0.75rem;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%}
.legend i.ln{width:22px;height:3px;border-radius:2px}.legend i.ln.dim{opacity:.55}
.legend .num{color:var(--amber-ink);font-size:0.75rem;min-width:22px}
.clock{position:absolute;right:28px;top:18px;text-align:right;z-index:2}
.clock b{display:block;font-size:2.875rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.clock span{color:var(--dim);font-size:0.8125rem}
.phase{color:var(--amber-ink)!important;font-weight:700}
/* 流量柱：一根柱子講完「人在哪」 */
.flows{position:absolute;left:28px;bottom:24px;width:220px;z-index:2}
.flow-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-bottom:10px}
.flow-bar i{display:block;height:100%}
.flow dl{margin:0;display:grid;grid-template-columns:12px 1fr auto;gap:4px 9px;align-items:center;font-size:0.8125rem}
.flow dt{width:10px;height:10px;border-radius:50%}
.flow dd{margin:0}.flow dd.n{font-weight:700;text-align:right;min-width:48px}
.flow dd.l{color:var(--dim)}
.focus{position:absolute;right:28px;bottom:24px;width:250px;font-size:0.8125rem;color:var(--dim);z-index:2}
.focus strong{color:var(--ink);font-size:0.9375rem;display:block;margin-bottom:6px}
.focus ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.focus li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.focus li.now{color:var(--ink)}.focus li.now span:first-child{color:var(--amber-ink)}
/* 底部示意進度軸 */
.deck{grid-row:2;border-top:1px solid var(--line);padding:14px 28px 18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.play{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.play:hover{background:var(--hover)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 10px;color:var(--dim);font-size:0.8125rem}
.seg button[aria-pressed=true]{background:var(--line);color:var(--ink)}
.lanes button[aria-pressed=true]{background:var(--amber);color:var(--on-amber);font-weight:700}
.track{position:relative;cursor:pointer;touch-action:none;display:grid;gap:6px;padding:4px 0;margin-left:calc(2.75rem + 8px)}   /* 「西一入口」四字寬＋間距，跟字級放大 */
.lane{position:relative;height:16px;font-size:0.6875rem;color:var(--dim)}
.lane>b{position:absolute;right:100%;margin-right:8px;font-weight:500;white-space:nowrap;line-height:16px}
.lane i{position:absolute;top:0;height:100%;border-radius:3px;font-style:normal;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 1px var(--bg)}
.lane i span{position:absolute;left:3px;top:0;line-height:16px;font-weight:700;white-space:nowrap}
.lane i.dd{background:linear-gradient(var(--white) 0 50%,var(--dd-blue) 50% 100%);color:#1b2629}   /* 數字壓在下半段：淺色用較亮的藍，讓 #1b2629 保持 4.5:1 */
.lane.g i{background:var(--gate);color:var(--ink)}
@container (max-width:25px){.lane.s i span{display:none}}
@container (max-width:13px){.lane.g i span{display:none}}
.head{position:absolute;top:-6px;bottom:-4px;width:2px;background:var(--amber);pointer-events:none}
.head::after{content:'';position:absolute;top:-4px;left:-5px;border:6px solid transparent;border-top-color:var(--amber)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);padding:0 16px;text-align:center}
/* 矮視窗：圖例、事件清單讓位，避免跟左下流量柱、底部進度軸疊在一起 */
@media(max-height:760px){.legend{display:none}}
@media(max-height:620px){.focus{display:none}.flow dl{gap:2px 9px;font-size:0.75rem}}
@media(max-height:480px){.flows{display:none}}
@media(max-width:860px){.focus,.legend{display:none}.title{left:16px;top:14px;max-width:calc(100% - 32px)}.title h1{font-size:1.25rem}.title p{font-size:0.6875rem;margin-bottom:4px}.clock{top:auto;bottom:10px;right:16px;max-width:150px}.clock b{font-size:2.125rem}.clock span{display:block}.flows{width:180px;left:16px;bottom:10px}.deck{padding:10px 16px 12px;grid-template-columns:1fr;gap:10px}.ctl{gap:6px}.play{width:44px;height:44px}.seg button{padding:6px 7px;font-size:0.75rem}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="maps"><canvas id="cv" aria-label="版本 3.1 全場動線地圖"></canvas><div class="loading" id="loading">讀取動線資料…</div></div>
 <div class="hud">
  <div class="title" id="title"><h1>版本 3.1 · 指揮台</h1><p>1,609 人 · 白藍兩路下樓、經通行帶走到自己那一排後方迴轉、散成六路到各大隊集合位置，九隊站齊後依序放行、一排六人並肩右轉進門 · 動畫節奏非現場秒數</p>
   <div class="legend"><span><i class="ln" style="background:var(--white)"></i>白衣隊伍</span><span><i class="ln" style="background:var(--blue)"></i>藍衣隊伍</span><span><i class="ln dim" style="background:var(--blue)"></i>集合位置整隊中</span><span><i class="ln" style="background:var(--dim);height:0;border-top:2px dashed var(--dim)"></i>通行帶（假設）</span><span><b class="num" style="min-width:auto">5·201</b>集合位置：大隊 5，此刻 201 人在等（畫面擠時的寫法）</span><span><i class="ln" style="background:var(--amber)"></i>所選路別正在走的人</span></div>
  </div>
  <div class="clock"><b id="clock">0%</b><span class="phase" id="phase"></span></div>
  <div class="flows"><div class="flow"><div class="flow-bar" id="bar"></div><dl id="dl"></dl></div></div>
  <div class="focus"><strong>示意事件</strong><ol id="cues"></ol></div>
 </div>
 <div class="deck">
  <div class="ctl">
   <button class="play" id="play" aria-label="播放"><svg width="18" height="20" viewBox="0 0 18 20" id="ico" aria-hidden="true"><path d="M2 1.5v17L17 10z" fill="currentColor"/></svg></button>
   <div class="seg" id="speed" role="group" aria-label="播放速度"></div>
   <div class="seg lanes" id="lanes" role="group" aria-label="高亮路別"></div>
  </div>
  <div class="track" id="track" role="slider" aria-label="示意進度軸" aria-valuemin="0" aria-valuenow="0" tabindex="0">
   <div class="lane s" data-track="stair"><b>樓梯</b></div>
   <div class="lane g" data-track="gate"><b>西一入口</b></div>
   <div class="head" id="head"></div>
  </div>
 </div>
</div>
<script>
'use strict';
const {pos,state,counts,View,LANE_NAME}=Dome,$=id=>document.getElementById(id);
Dome.nav('console.html');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const C={},readC=()=>{for(const n of ['map','floor','line','faint','dim','ink','white','blue','amber','amber-ink','teal','bg'])C[n]=css(n);};readC();
const STATES=[['seated','休息區','faint'],['walk','走廊／樓梯','teal'],['wait','集合區','amber'],['enter','進場中','blue'],['done','已到位','white']];   // 第三欄是 C 的鍵：換主題時重讀
const {esc}=Dome;
let ds=null,S=null,view=null,t=0,T=1,playing=false,speed=1,last=0,dirty=true,cues=[];
const hl=new Set();   // 目前高亮的路別（可多選）
const pct=x=>x/T*100+'%';
// 時間軸兩軌：樓梯九大隊（白藍兩路同時，取兩路最早／最晚通過樓梯口）、西一入口九大隊
function stats(ds){
 const st=Array.from({length:9},(_,i)=>{const ps=ds.P.filter(p=>p.dadui===i+1);return {k:i+1,full:Math.max(...ps.map(p=>p.t.assembly)),go:Math.min(...ps.map(p=>p.t.enter))};});
 const span=(gs,a,b)=>({n:gs.reduce((s,g)=>s+g.population,0),a:Math.min(...gs.map(g=>g[a])),b:Math.max(...gs.map(g=>g[b]))});
 const of=k=>ds.groups.filter(g=>g.dadui===k);
 const stair=Array.from({length:9},(_,i)=>({k:i+1,...span(of(i+1),'tStairFirst','tStairLast')}));
 const dad=Array.from({length:9},(_,i)=>({k:i+1,...span(of(i+1),'tGateFirst','tGateLast')}));
 return {stair,dad,st,fieldBox:Dome.bounds(ds.P.map(p=>[p.field.X,p.field.Y]),.08)};}   // fieldBox：第 9 排對齊線的南北範圍（座位不動，載入時算一次）
function buildTrack(){
 document.querySelector('[data-track="stair"]').insertAdjacentHTML('beforeend',S.stair.map(o=>`<i data-dadui="${o.k}" class="dd" style="left:${pct(o.a)};width:calc(${pct(o.b-o.a)} - 2px)" title="大隊 ${o.k}：${o.n} 人（白藍兩路）"><span>${o.k}</span></i>`).join(''));
 document.querySelector('[data-track="gate"]').insertAdjacentHTML('beforeend',S.dad.map(o=>`<i data-dadui="${o.k}" style="left:${pct(o.a)};width:calc(${pct(o.b-o.a)} - 2px)" title="大隊 ${o.k}：${o.n} 人"><span>${o.k}</span></i>`).join(''));}
function phaseName(c){if(c.done===ds.P.length)return '全員到位';if(t<ds.D.meta.t0)return '休息區就座';
 const dad=S.dad.filter(o=>t>=o.a).pop();if(dad)return `大隊 ${dad.k} 進場中`;
 if(c.wait){const n=S.st.filter(o=>t>=o.full).length;return n===9?'九個大隊都已站齊，等放行':`集合區整隊中（${n} 個大隊已站齊）`;}
 return t>=S.stair[0].a?'大隊 1 下樓、往集合區':'大隊 1 離座';}
function draw(){const v=view,c=v.begin(C.map),D=ds.D,P=ds.P,r=Math.max(1.1,.042*v.s);
 // 集合位置標籤：「大隊 d　此刻在等的人數」（橘）；手機等擠的時候寫成「d·人數」（圖例有說明）。排的時候避開西一入口的字
 const w={};for(const p of P)if(state(p,t)==='wait')w[p.dadui]=(w[p.dadui]||0)+1;
 const G6=D.nodes.GATE6,g6=v.p(G6.X,G6.Y),g6w=v.measure(G6.label,{size:13,weight:900});
 v.base(D.map,{floor:C.floor,fieldLine:C.line,stage:C.line,wall:C.faint,band:C.dim,bandA:.07,lane:C.teal,laneA:.06,stand:C.faint,gate:C.amber,gateLanes:[C.white,C.blue],gateLanesA:.3,
  stagingInk:C.dim,stagingHot:C['amber-ink'],stagingHalo:C.map,stagingAvoid:[[g6[0]-14-g6w,g6[1]-10,g6[0]-14,g6[1]+10]],
  stagingText:b=>{const n=w[b.dadui]||0;return {s:n?`大隊 ${b.dadui}　${n}`:`大隊 ${b.dadui}`,short:n?`${b.dadui}·${n}`:String(b.dadui),hot:n>0};}});
 window.__gateLanesDrawn=v.gateLanesDrawn;window.__stageLabelBoxes=v.stagingBoxes;

 for(const s of D.map.stands)v.text(s.sec,...s.labelXY,{color:C.dim,size:10,dx:6});
 c.globalAlpha=.35;for(const p of P)if(state(p,t)!=='done')v.dot(p.field.X,p.field.Y,Math.max(.6,.03*v.s),null,C.faint,.6);c.globalAlpha=1;
 {const a=D.nodes.STAIR_TOP,b=D.nodes.STAIR_BOT;v.text('樓梯',(a.X+b.X)/2,(a.Y+b.Y)/2,{color:C.dim,size:12,weight:700,halo:C.map,align:'right',dx:-30,dy:8});}
 v.text(D.nodes.GATE6.label,D.nodes.GATE6.X,D.nodes.GATE6.Y,{color:C['amber-ink'],size:13,weight:900,halo:C.map,align:'right',dx:-14});
 // 第 9 排對齊線（第 9 排東側的欄間空隙）：第 10 排以東的人，每一排六人都在這條線對齊再一起往東
 {const A=D.map.align,[,y0,,y1]=S.fieldBox;v.stroke([A.x,y0,A.x,y1],C['amber-ink'],1.5,[5,4]);v.text(`第 ${A.pai} 排對齊`,A.x,y0,{color:C['amber-ink'],size:11,weight:800,halo:C.map,base:'bottom',dy:-3});}
 // 休息區淡點、到位實點
 for(const p of P){const st=state(p,t);if(st!=='seated'&&st!=='done')continue;const q=pos(p,t);c.globalAlpha=st==='seated'?.3:1;v.dot(q[0],q[1],st==='seated'?r*.7:r,p.costume==='白'?C.white:C.blue);}c.globalAlpha=1;
 // 隊伍線：同一列、同一階段（走／等／進場）的人依前後順序連成一條；彼此距離拉開就斷開。排隊中畫淡，行進中在線頭加點標出前方。
 // 一列只走一路（白衣 A、藍衣 B），所以按下路別時整條正在走的線改橘色，其餘壓淡。
 const rows=new Map();for(const p of P){const st=state(p,t);if(st==='seated'||st==='done')continue;const key=p.lie+'|'+st;(rows.get(key)||rows.set(key,[]).get(key)).push(p);}
 c.lineCap='round';c.lineJoin='round';const any=hl.size>0;
 for(const [key,ps] of rows){const st=key.split('|')[1],hot=any&&st!=='wait'&&hl.has(ps[0].lane),col=hot?C.amber:ps[0].costume==='白'?C.white:C.blue;
  ps.sort(st==='enter'?(a,b)=>a.t.gate-b.t.gate:st==='wait'?(a,b)=>a.t.assembly-b.t.assembly:(a,b)=>a.laneIdx-b.laneIdx);
  const pts=ps.map(p=>pos(p,t)),alpha=(st==='wait'?.55:.95)*(any&&!hot?.5:1);let seg=[pts[0]];
  const flush=()=>{c.globalAlpha=alpha;if(seg.length>1)v.stroke(seg.flat(),col,r*(hot?2.2:1.7));else v.dot(seg[0][0],seg[0][1],r,col);c.globalAlpha=1;};
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(Math.hypot(a[0]-b[0],a[1]-b[1])>.45){flush();seg=[b];}else seg.push(b);}flush();
  if(st!=='wait'){c.globalAlpha=alpha;v.dot(pts[0][0],pts[0][1],r*1.5,col,C.map,1);c.globalAlpha=1;}}}
function ui(){const c=counts(t,ds.P),N=ds.P.length;
 for(const [k] of STATES){$('bar').querySelector(`[data-k="${k}"]`).style.width=c[k]/N*100+'%';$('dl').querySelector(`[data-n="${k}"]`).textContent=c[k].toLocaleString('zh-TW');}
 $('clock').textContent=Math.round(t/T*100)+'%';   // 不顯示時間（示意節奏），只顯示進度
$('phase').textContent=phaseName(c);$('head').style.left=pct(t);
 track.setAttribute('aria-valuenow',Math.round(t));track.setAttribute('aria-valuetext',Math.round(t/T*100)+'%');
 let i=cues.findIndex(x=>x.t>t);if(i<0)i=cues.length;const from=Math.max(0,Math.min(i-2,cues.length-5));
 $('cues').innerHTML=cues.slice(from,from+5).map((x,j)=>`<li class="${from+j===i-1?'now':''}"><span>${from+j+1}</span><span>${esc(x.s)}</span></li>`).join('');}
function setPlaying(on){playing=on;if(on&&t>=T)t=0;$('play').setAttribute('aria-label',on?'暫停':'播放');$('ico').innerHTML=on?'<rect x="2" y="1.5" width="5" height="17" fill="currentColor"/><rect x="11" y="1.5" width="5" height="17" fill="currentColor"/>':'<path d="M2 1.5v17L17 10z" fill="currentColor"/>';last=0;}
$('play').onclick=()=>setPlaying(!playing);
$('speed').innerHTML=[.5,1,2,5].map(s=>`<button data-s="${s}" aria-pressed="${s===speed}">×${s}</button>`).join('');
$('speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;$('speed').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};
$('lanes').innerHTML=['A','B'].map(L=>`<button data-lane="${L}" aria-pressed="false" title="${LANE_NAME[L]}">${L} 路</button>`).join('');
$('lanes').onclick=e=>{const b=e.target.closest('[data-lane]');if(!b)return;const L=b.dataset.lane,on=!hl.has(L);hl[on?'add':'delete'](L);b.setAttribute('aria-pressed',on);dirty=true;};
const track=$('track');function scrub(e){const r=track.getBoundingClientRect();t=Math.max(0,Math.min(T,(e.clientX-r.left)/r.width*T));dirty=true;}
let drag=false;track.onpointerdown=e=>{drag=true;track.setPointerCapture(e.pointerId);scrub(e);};track.onpointermove=e=>drag&&scrub(e);track.onpointerup=track.onpointercancel=()=>drag=false;
document.onkeydown=e=>{if(!ds)return;if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();setPlaying(!playing);}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){t=Math.max(0,Math.min(T,t+(e.key==='ArrowLeft'?-10:10)));dirty=true;}};
function frame(now){if(playing){if(last)t=Math.min(T,t+(now-last)/1000*speed);last=now;dirty=true;if(t>=T)setPlaying(false);}if(view.step(now))dirty=true;if(dirty){draw();ui();dirty=false;}requestAnimationFrame(frame);}
window.__seek=x=>{t=Math.max(0,Math.min(T,x));dirty=true;};
(async()=>{try{ds=await Dome.load();}catch(e){$('loading').textContent=e.message;return;}
 readC();   // 讀取期間可能已切換主題（那時 onPrefs 還沒註冊），第一次繪製前重讀
 S=stats(ds);T=ds.T_END;
 // 取景：手機裁掉右側空著的舞台端、左側留出標籤空間；寬螢幕不縮放，只把地圖往右推，避開左上的標題／圖例欄（右側有餘裕才推）
 view=new View($('cv'),{pad:40});
 const refit=()=>{const B=ds.B.all,mobile=view.w<760;view.pad=mobile?12:40;const b=mobile?[-20,B[1],3.6,B[3]]:B;view.fit(b,true);
  if(mobile){const top=view.p(b[0],b[1])[1],want=$('title').getBoundingClientRect().bottom-$('cv').getBoundingClientRect().top+8;if(top>want)view.cy+=(top-want)/view.s;}   // 手機：地圖貼著標題區下緣，把空白留給底下的流量柱與時鐘
  else{const left=view.p(b[0],b[1])[0],free=view.w-view.pad-view.p(b[2],b[3])[0],need=Math.min(360-left,Math.max(0,free));if(need>0)view.cx-=need/view.s;}};
 refit();view.onresize=()=>{refit();dirty=true;};
 Dome.onPrefs(()=>{readC();requestAnimationFrame(()=>{refit();dirty=true;});});   // 換主題重讀顏色；換字級標題變高，手機取景要重算
 track.setAttribute('aria-valuemax',Math.round(T));
 buildTrack();
 cues=[{t:0,s:'全員就座'},...S.stair.map(o=>({t:o.a,s:`大隊 ${o.k} 兩路下樓梯`})),...S.st.map(o=>({t:o.full,s:`大隊 ${o.k} 在集合位置站齊`})),...S.st.map(o=>({t:o.go,s:`大隊 ${o.k} 放行`})),...Object.entries(ds.D.map.align.ranks).map(([k,v])=>({t:v[0],s:`大隊 ${k} 排頭在第 9 排對齊、一起走`})),...S.dad.map(o=>({t:o.a,s:`大隊 ${o.k} 由西一入口進場`})),{t:T,s:'全員到位'}].sort((a,b)=>a.t-b.t);
 $('bar').innerHTML=STATES.map(([k,,c])=>`<i data-k="${k}" style="background:var(--${c})"></i>`).join('');
 $('dl').innerHTML=STATES.map(([k,l,c])=>`<dt style="background:var(--${c})"></dt><dd class="l">${l}</dd><dd class="n" data-n="${k}">0</dd>`).join('');
 $('loading').remove();
 draw();ui();dirty=false;window.__dome_ready=true;
 requestAnimationFrame(frame);})();
</script>
