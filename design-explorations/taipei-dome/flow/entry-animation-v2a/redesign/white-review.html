<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白衣接續複核 · 版本 2a · 上藍下白 · 大隊長口令卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#141a1c;--card:#1d2528;--ink:#f1f3ef;--dim:#a3b0ae;--rule:#2d383b;--team:#e05d63;--team-ink:#1a0d0e;--white:#f3eee4;--blue:#5a9be8;--good:#7fc8f8;--bad:#f2a07b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
::selection{background:var(--team);color:var(--team-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--team);outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:14px max(16px,env(safe-area-inset-left)) 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--dim);text-decoration:none;font-size:14px}
.vswitch{display:inline-flex;background:var(--card);border-radius:10px;padding:3px}
.vswitch button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--dim)}
.vswitch button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.pick{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin:14px 0 16px}
.pick button{border:1.5px solid var(--rule);background:var(--card);border-radius:12px;height:52px;font-size:20px;font-weight:900;position:relative}
.pick button i{position:absolute;left:50%;bottom:7px;width:16px;height:3px;border-radius:2px;transform:translateX(-50%)}
.pick button[aria-pressed=true]{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.pick button[aria-pressed=true] i{background:var(--team-ink)!important}
.grid{display:grid;gap:14px}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.next{background:var(--team);color:var(--team-ink);border-radius:22px;padding:20px 22px 22px;transition:background .3s}
.next small{font-size:15px;font-weight:700}
.next h1{margin:2px 0 4px;font-size:clamp(30px,7vw,46px);line-height:1.15;font-weight:900;letter-spacing:.01em}
.next p{margin:0;font-size:17px;font-weight:500}
.next .count{font-size:clamp(44px,10vw,72px);font-weight:900;line-height:1;margin-top:12px;letter-spacing:-.02em}
.next .count span{font-size:16px;font-weight:700;letter-spacing:0;margin-left:6px}
.card{background:var(--card);border-radius:18px;padding:16px 18px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--dim);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.lanes{display:grid;gap:9px}
.lane{display:grid;grid-template-columns:76px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.lane b{font-size:15px}
.lane .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--rule)}
.lane .bar i{height:100%}
.lane .st{text-align:right;color:var(--dim);font-size:13px}
.lane .st.ok{color:var(--team);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:12px}
.legend span{display:flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px}
ol.cues{list-style:none;margin:0;padding:0}
.cues li{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--rule);color:var(--dim)}
.cues.cmp li{grid-template-columns:58px 58px 1fr auto}
.cues li.head{font-size:12px;border-top:0;padding-top:0}
.cues li:first-child{border-top:0}
.cues li time{font-weight:700}
.cues li .old{font-weight:400}
.cues li .d{font-size:13px;font-weight:700;text-align:right}
.cues li .d.good{color:var(--good)}.cues li .d.bad{color:var(--bad)}
.cues li.done span.h{text-decoration:line-through;text-decoration-color:var(--rule);text-decoration-thickness:2px}
.cues li.cur{color:var(--ink)}.cues li.cur time:not(.old){color:var(--team)}
canvas{display:block;width:100%;height:300px;border-radius:12px}
.deck{display:flex;gap:10px;align-items:center;margin-top:14px}
.deck button.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.deck input{flex:1;accent-color:var(--team)}
.deck output{min-width:52px;text-align:right;font-weight:700}
.sum{font-size:14px;color:var(--dim);margin:8px 0 0}
.sum b{color:var(--ink)}
@media(max-width:520px){.pick{gap:4px}.pick button{height:46px;font-size:17px;border-radius:10px}.lane{grid-template-columns:64px 1fr 56px}}
.notice{margin:14px 0;padding:12px 14px;border:1px solid #876a33;border-radius:12px;font-size:13px;color:#f8d49b}.filters{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}.filters select{background:#1d2528;color:#f1f3ef;border:1px solid #667b80;padding:5px;border-radius:6px}#checks,#sources{font-size:13px;line-height:1.8}#sources table{width:100%;border-collapse:collapse}#sources td{border-top:1px solid #455;padding:4px}canvas{height:440px}.cues li{cursor:pointer}@media(max-width:600px){canvas{height:340px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="top"><a class="back" href="index.html">‹ 版本 2a · 上藍下白</a><div id="vs"></div></div>
<div class="notice"><b>白衣 1→9 · 三路接續複核</b>　動畫為示意進度，非現場秒數；白衣相關時序點距檢查通過；全場及現場容量尚未認證。<br>三路依序接續，白衣保留樓梯候隊；多出口提前供應，逐路持續接尾，不等整隊清空。</div>
<div class="filters"><label>衣色 <select id="color"><option value="藍">藍衣</option><option value="白">白衣</option><option value="all">三藍三白</option></select></label><label>路線 <select id="route-phase"><option value="arrival">離座 → 集結</option><option value="departure">集結 → 6口</option><option value="field">6口 → 就定位</option><option value="all">完整流程</option></select></label><label><input id="following" type="checkbox">疊看後兩隊</label><label><input id="routes" type="checkbox" checked>畫出路線</label></div>
<div class="pick" id="pick" role="group" aria-label="選擇大隊"></div>
<div class="grid two">
 <div class="grid">
  <section class="next" aria-live="polite"><small id="nx-k">讀取動線資料…</small><h1 id="nx-h"></h1><p id="nx-d"></p><div class="count" id="nx-c"></div></section>
  <section class="card"><h2 id="lanes-h">隊列狀態</h2><div class="lanes" id="lanes"></div>
   <div class="legend"><span><i style="background:#56636a"></i>休息區</span><span><i style="background:var(--dim)"></i>走廊／樓梯</span><span><i style="background:var(--team);opacity:.55"></i>集結等待</span><span><i style="background:var(--team)"></i>進場中</span><span><i style="background:var(--ink)"></i>到位</span></div>
   <div class="deck"><button class="play" id="play" aria-label="播放"><svg width="14" height="16" viewBox="0 0 14 16" id="ico"><path d="M1 1v14l12-7z" fill="currentColor"/></svg></button><input type="range" id="tl" min="0" step=".1" aria-label="示意進度"><output id="clk"></output></div>
  </section>
 </div>
 <div class="grid" style="align-content:start">
  <section class="card"><h2><span>示意事件表</span><span id="cue-v"></span></h2><ol class="cues" id="cues"></ol><p class="sum" id="sum"></p></section>
  <section class="card"><div id="checks"></div><div id="sources"></div><div id="cross-team"></div></section><section class="card" style="padding:8px"><canvas id="c" aria-label="本大隊位置圖"></canvas></section>
 </div>
</div>
</div>
<script src="core.js"></script>
<script>
'use strict';
const {pos,state,counts,fmt,delta,View}=Dome,$=id=>document.getElementById(id);
const TEAM=['#e05d63','#d9ae3a','#79c25a','#b688dd','#f0a050','#bfc35a','#e586bd','#c9945e','#4fc2b4'];
const qp=new URLSearchParams(location.search);
let k=Math.max(1,Math.min(9,Number(qp.get('k'))||1)),t=0,playing=false,last=0,dirty=true,cues=[],lanes=[],sets=[],ds=null,color=qp.get('color')==='blue'?'藍':'白',whiteAudit=null;
$('color').value=color;$('following').checked=true;
$('pick').innerHTML=TEAM.map((c,i)=>`<button data-k="${i+1}" aria-pressed="${i+1===k}">${i+1}<i style="background:${c}"></i></button>`).join('');
$('pick').onclick=e=>{const b=e.target.closest('button');if(b)choose(+b.dataset.k);};
const minT=(ps,key)=>Math.min(...ps.map(p=>p.t[key])),maxT=(ps,key)=>Math.max(...ps.map(p=>p.t[key]));
// 口令以 id 定義，方便兩版逐條對照；集結區依該版實際分區各自一條
function cuesFor(d){const ps=d.P.filter(p=>p.dadui===k&&(color==='all'||p.costume===color)),prev=d.P.filter(p=>p.dadui===k-1&&(color==='all'||p.costume===color)),spots=[...new Set(ps.map(p=>p.assembly))];
 const one=spots.length===1;
 return [
  {id:'l0',t:minT(ps,'leave'),h:'第一位離座',d:'休息區開始有人起身'},
  {id:'l1',t:maxT(ps,'leave'),h:'最後一位離座',d:'選取隊列離開休息座位'},
  ...spots.map(s=>{const g=ps.filter(p=>p.assembly===s),c=[...new Set(g.map(p=>p.costume))];return {id:'a-'+c.join(''),t:maxT(g,'assembly'),h:s==='FEEDER'?'最後一位匯入固定路':one?'選取隊列到齊':`${c.join('')}衣到齊`,d:s==='FEEDER'?'各出口按序接尾；不在單點等待全隊':`${d.nodeName(s)} ${g.length} 人提前就緒`};}),
  ...(prev.length?[{id:'p',t:maxT(prev,'gate'),h:`大隊 ${k-1} 最後一位過 6口`,d:'參考事件；後隊已逐路接尾，此非離座條件'}]:[]),
  {id:'go',t:minT(ps,'enter'),h:`大隊 ${k} 出發`,d:'每一路跟前人接續，換大隊不停止、不重新同步'},
  {id:'g1',t:maxT(ps,'gate'),h:'最後一位過 6口',d:k<9?`交給大隊 ${k+1}`:'最後一個大隊'},
  {id:'ok',t:maxT(ps,'arrive'),h:'選取隊列到位',d:'示意路徑完成，非現場放行認證'},
 ].sort((a,b)=>a.t-b.t);}
function choose(n){k=n;document.documentElement.style.setProperty('--team',TEAM[k-1]);$('pick').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===k));
 if(!ds)return; document.title='E · '+ds.label+' '+ds.sub+' · '+color+k; const ps=ds.P.filter(p=>p.dadui===k&&(color==='all'||p.costume===color)),cmp=sets.length>1;
 lanes=[...new Set(ps.map(p=>p.lie))].sort((a,b)=>a-b).map(lie=>({lie,ps:ps.filter(p=>p.lie===lie)}));
 cues=cuesFor(ds);const old=cmp?new Map(cuesFor(sets[0]).map(c=>[c.id,c])):null;
 $('cues').className='cues'+(cmp?' cmp':'');$('cue-v').textContent=cmp?'版本 2a → 版本 2b':ds.label;
 $('cues').innerHTML=(cmp?`<li class="head"><span>版本 2a</span><span>版本 2b</span><span></span><span>註</span></li>`:'')+cues.map(c=>{const o=old&&(old.get(c.id)||(c.id.startsWith('a-')?[...old.values()].find(x=>x.id.startsWith('a-')&&(x.id.includes(c.id.slice(2))||c.id.includes(x.id.slice(2)))):null)),dv=o?c.t-o.t:0;
  return `<li data-t="${c.t}">${cmp?`<time class="old">${o?fmt(o.t):'—'}</time>`:''}<time>${fmt(c.t)}</time><span class="h">${c.h}</span>${cmp?`<span class="d">${o?'—':'新'}</span>`:'<span></span>'}</li>`;}).join('');
 $('sum').textContent='兩版進度各自正規化，不能用百分比差判斷快慢。切換版本檢視其地圖；對照模式地圖顯示 2b。';
 $('lanes-h').textContent=`大隊 ${k} · 隊列狀態`;
 $('tl').min=Math.max(0,cues[0].t-.3);$('tl').max=Math.min(ds.T_END,Math.max(cues[cues.length-1].t,...following().map(p=>p.t.arrive))+.3);t=+$('tl').min;
 updateDetails(); fitRoute(); dirty=true;}
function selected(){return ds.P.filter(p=>p.dadui===k&&(color==='all'||p.costume===color));}
function route(p){const a=$('route-phase').value;return p.path.filter(q=>a==='all'||(a==='arrival'?q[2]<=p.t.assembly:a==='departure'?q[2]>=p.t.enter&&q[2]<=p.t.gate:q[2]>=p.t.gate));}
function following(){return ds&&$('following').checked?ds.P.filter(p=>p.costume===color&&p.dadui>k&&p.dadui<=Math.min(9,k+2)):[];}
function fitRoute(){if(ds)v.fit(Dome.bounds([...selected(),...following()].flatMap(p=>route(p).map(q=>q.slice(0,2))),.6),true);}
function updateDetails(){renderCrossTeam();const gs=ds.D.groups.filter(g=>g.dadui===k&&(color==='all'||g.costume===color));
 $('checks').innerHTML=gs.map(g=>`<b>${g.key} · ${g.population} 人</b><br>靜態線段交點：離座→集結 ${g.checks.arrival.count}／集結→6口 ${g.checks.departure.count}／門口接縫 ${g.checks.gateSeam.count}／場內 ${g.checks.field.count}<br>${g.status}`).join('<hr>')+'<p>交點數是幾何檢查，非碰撞人數。0 也不代表全員同時通過已驗證。橘圈為該段抽樣交點。</p>';
 $('sources').innerHTML='<table><tr><td>列／樓梯路</td><td>實際休息區來源</td></tr>'+lanes.map(l=>{const ss={};for(const p of l.ps)ss[p.feeder]=(ss[p.feeder]||0)+1;return `<tr><td>${l.lie}／${l.ps[0].stairLane}</td><td>${Object.entries(ss).map(([s,n])=>s.replace('L','左').replace('R','右')+'：'+n+' 人').join('、')}</td></tr>`;}).join('')+'</table>';
}
function renderCrossTeam(){const el=$('cross-team');if(!ds||color!=='白'){el.innerHTML='';return;}
 const chain=[1,2,3].map(j=>Array.from({length:9},(_,d)=>j+6*d).join(' → '));
 el.innerHTML='<p><b>白衣三路連續接尾</b><br>'+chain.map((x,j)=>`<span style="color:${['#edc56c','#65d7bc','#bc9df5'][j]}">${'ABC'[j]}：${x}</span>`).join('<br>')+'</p><p>A：白1–5用139，白6–9接140右。<br>B：白1–4用141右，白5–9接143。<br>C：白1–9用145。</p><p><b>白2提前在樓梯與下端候隊，白3提前在B1接尾。</b>白4以後由各出口提前補入，不等前大隊過6口才離座。</p><button onclick="showQueue()">看白1／白2／白3候隊</button> <button onclick="showHandoff()">看本隊與後隊持續接尾</button>';
 if(whiteAudit){const pairs=whiteAudit.crossArrival.filter(p=>p.from===k&&p.to<=k+2);el.innerHTML+='<p>三路各自272／269／268人，跨白1→9相鄰過口間隔均為0.32示意單位；沒有大隊空拍。場內先導為C、B、A，固定時差後各路不停。</p><p>涉及白衣的全程同時點距衝突：'+whiteAudit.allWhiteRelatedTimedPairs+'（門檻0.03圖面單位，含候隊與已定位者，非人體寬度認證）。</p>'+pairs.map(p=>`<p>白${p.from} → 白${p.to}：B1／樓梯至6口橫切 ${p.count}；場內 ${p.fieldCrossings} 個靜態交點，由固定先導時差錯開。<br><button onclick="showCross(${p.from},${p.to})">看場內連續轉入</button></p>`).join('')+'<p><a href="../white-continuous-seats.png" style="color:#8acbff">看重排座位與候隊實圖</a> · <a href="../white-review.json" style="color:#8acbff">逐路接續驗證</a></p>';}
}
function showCross(from,to){const pair=whiteAudit.crossArrival.find(p=>p.from===from&&p.to===to),ex=pair&&pair.fieldExamples[0];if(!ex)return;$('following').checked=true;$('routes').checked=true;$('route-phase').value='field';v.fit(Dome.bounds([...ex.firstSegment,...ex.secondSegment],.6),true);t=ex.nextHeadProgress;dirty=true;}
function showQueue(){$('routes').checked=false;color='白';$('color').value=color;$('following').checked=true;$('route-phase').value='all';choose(1);t=ds.D.meta.gateStartProgress-0.5;v.fit([-14,-2.8,-10.4,4.5],true);dirty=true;}
function showHandoff(){$('routes').checked=false;color='白';$('color').value=color;$('following').checked=true;$('route-phase').value='all';choose(k);t=maxT(selected(),'gate');v.fit([-14,-3,-10,4.6],true);dirty=true;}
$('following').onchange=()=>{fitRoute();dirty=true;};
$('color').onchange=e=>{color=e.target.value;choose(k);};
$('route-phase').onchange=()=>{fitRoute();const key={arrival:'leave',departure:'enter',field:'gate',all:'leave'}[$('route-phase').value];t=minT(selected(),key);dirty=true;};
$('routes').onchange=()=>{dirty=true;};
$('cues').onclick=e=>{const li=e.target.closest('[data-t]');if(li){t=+li.dataset.t;dirty=true;}};
const v=new View($('c'),{pad:10});v.onresize=()=>{dirty=true;};
const ST=[['seated','#56636a'],['walk','#a3b0ae'],['wait','TEAMA'],['enter','TEAM'],['done','#f1f3ef']];
function draw(){const team=TEAM[k-1],ps=ds.P.filter(p=>p.dadui===k&&(color==='all'||p.costume===color)),D=ds.D;
 $('lanes').innerHTML=lanes.map(l=>{const c=counts(t,l.ps),n=l.ps.length,c0=l.ps[0].costume,ok=c.done===n?'到位':c.wait===n?'到齊':'';
  return `<div class="lane"><b>列 ${l.lie}</b><div class="bar">${ST.map(([s,col])=>`<i style="width:${c[s]/n*100}%;background:${col==='TEAM'?team:col==='TEAMA'?team+'8c':col}"></i>`).join('')}</div><span class="st ${ok?'ok':''}">${ok||c0+'衣 '+n}</span></div>`;}).join('');
 const i=cues.findIndex(c=>c.t>t),nx=cues[i<0?cues.length-1:i];
 $('nx-k').textContent=i<0?'選取隊列示意完成':`下一個示意事件 · ${fmt(nx.t)}${sets.length>1?' · '+ds.label:''}`;$('nx-h').textContent=nx.h;$('nx-d').textContent=nx.d;
 $('nx-c').innerHTML=i<0?'完成':`${fmt(nx.t-t)}<span>進度後</span>`;
 $('cues').querySelectorAll('li[data-t]').forEach((li,j)=>{li.classList.toggle('done',cues[j].t<=t);li.classList.toggle('cur',j===i);});
 $('clk').textContent=fmt(t);$('tl').value=t;
 const c=v.begin('#11171a');v.base(D.map,{floor:'#1a2326',stage:'#263236',wall:'#2d383b',band:'#a3b0ae',bandA:.07,stand:'#2d383b'});
 if($('routes').checked){
 for(const p of following()){c.globalAlpha=.25;v.stroke(route(p).flatMap(q=>q.slice(0,2)),['#edc56c','#65d7bc','#bc9df5'][(p.lie-1)%3],1,[4,3]);}c.globalAlpha=1;
 if(color==='白'&&whiteAudit&&$('following').checked&&['field','all'].includes($('route-phase').value))for(const pair of whiteAudit.crossArrival.filter(p=>p.from===k&&p.to<=k+2))for(const ex of pair.fieldExamples)v.dot(ex.point[0],ex.point[1],6,null,'#ffb33f',2);
 for(const p of ps){c.globalAlpha=.20;v.stroke(route(p).flatMap(q=>q.slice(0,2)),p.costume==='白'?['#edc56c','#65d7bc','#bc9df5'][(p.lie-1)%3]:'#5a9be8',1);}c.globalAlpha=1;
 const ph=$('route-phase').value;for(const g of D.groups.filter(g=>g.dadui===k&&(color==='all'||g.costume===color)))for(const [key,ch] of Object.entries(g.checks))if(ph==='all'||key===ph)for(const ex of ch.examples){const q=ex.point||ex.at||ex.xy;if(Array.isArray(q))v.dot(q[0],q[1],5,null,'#ffa64d',1.5);}}
 const r=Math.max(1.1,.045*v.s);c.globalAlpha=.25;for(const p of ds.P){if(p.dadui===k)continue;const q=pos(p,t);v.dot(q[0],q[1],r*.7,'#56636a');}c.globalAlpha=1;
